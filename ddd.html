<!DOCTYPE html>
<html lang="hi">
<head>
<style>html{background:#fff8ee}html:has(body.dark-mode){background:#181818}</style>
<script defer src="temple-runtime.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>श्री श्री राधा कृष्ण चन्द्र मन्दिर - लाइव दर्शन</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Rozha+One&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(180deg, #250202 0%, #110000 100%);
            font-family: 'Poppins', sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            text-align: center;
            padding: 20px 15px 12px;
            background: linear-gradient(180deg, rgba(230, 81, 0, 0.4) 0%, rgba(0,0,0,0) 100%);
            border-bottom: 2px solid rgba(255, 179, 0, 0.2);
        }

        .om-symbol {
            font-size: 28px;
            color: #ffca28;
            text-shadow: 0 0 15px rgba(255, 202, 40, 0.8);
        }

        .temple-title {
            font-family: 'Rozha One', serif;
            font-size: 20px;
            color: #ffecb3;
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 13px;
            color: #ffb74d;
            font-weight: 600;
            margin-top: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .live-dot {
            width: 9px;
            height: 9px;
            background-color: #ff1744;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #ff1744;
            animation: pulse 1.4s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.7; }
        }

        .player-container {
            width: 94%;
            max-width: 650px;
            margin: 15px auto;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8), 0 0 15px rgba(255, 179, 0, 0.25);
            border: 2px solid #ffb300;
            background: #000;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .card {
            width: 94%;
            max-width: 650px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 193, 7, 0.25);
            border-radius: 12px;
            padding: 16px;
            margin-top: 8px;
            margin-bottom: 25px;
            backdrop-filter: blur(8px);
        }

        .card-header {
            font-size: 15px;
            font-weight: 700;
            color: #ffd54f;
            margin-bottom: 12px;
            border-bottom: 1px dashed rgba(255, 213, 79, 0.3);
            padding-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .timings {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 13px;
            color: #ffe082;
        }

        .time-row {
            display: flex;
            justify-content: space-between;
        }

        .btn-refresh {
            display: block;
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #ff8f00, #ff6f00);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            margin-top: 15px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 111, 0, 0.35);
        }

        .btn-refresh:active {
            transform: scale(0.98);
        }

        .footer {
            margin-top: auto;
            padding: 15px;
            font-size: 12px;
            color: #ffb74d99;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="om-symbol">ॐ</div>
        <h1 class="temple-title">श्री श्री राधा कृष्ण चन्द्र मन्दिर</h1>
        <div class="subtitle">
            <span class="live-dot"></span> सीधा प्रसारण (लाइव दर्शन)
        </div>
    </div>

    <div class="player-container">
        <div class="video-wrapper">
            <!-- यहाँ ऑटोमैटिकली लेटेस्ट लाइव वीडियो लोड होगी -->
            <iframe 
                id="livePlayer"
                src="https://www.youtube.com/embed/L38uUzAtiXI?autoplay=1&mute=0&rel=0" 
                title="Mandir Live Darshan"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen>
            </iframe>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <span>🪔 नित्य आरती समय</span>
            <span style="font-size: 12px; opacity: 0.8;">दैनिक</span>
        </div>
        <div class="timings">
            <div class="time-row"><span>मंगला आरती</span><b>04:30 AM</b></div>
            <div class="time-row"><span>शृंगार आरती</span><b>07:15 AM</b></div>
            <div class="time-row"><span>संध्या आरती</span><b>07:00 PM</b></div>
            <div class="time-row"><span>शयन आरती</span><b>08:30 PM</b></div>
        </div>

        <button class="btn-refresh" onclick="checkLiveStream()">🔄 दर्शन ताज़ा करें (Refresh)</button>
    </div>

    <div class="footer">
        हरे कृष्ण हरे कृष्ण, कृष्ण कृष्ण हरे हरे ।<br>
        हरे राम हरे राम, राम राम हरे हरे ॥
    </div>

    <script>
        const CHANNEL_ID = "UC_zm9uW1HqiDFnUa7MBNL7A";
        // फॉलबैक वीडियो ID (ताकि स्क्रीन कभी खाली न रहे)
        let defaultVideoId = "L38uUzAtiXI"; 

        async function checkLiveStream() {
            try {
                // यह स्क्रिप्ट बिना किसी API Key के चैनल से ताज़ा वीडियो ID खींचती है
                const rssUrl = `https://www.youtube.com/feeds/videos.xml?channel_id=${CHANNEL_ID}`;
                const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(rssUrl)}`;

                const response = await fetch(proxyUrl);
                const xmlText = await response.text();
                
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, "text/xml");
                const entry = xmlDoc.querySelector("entry");

                if (entry) {
                    const videoIdTag = entry.querySelector("yt\\:videoId, videoId");
                    if (videoIdTag && videoIdTag.textContent) {
                        const newVideoId = videoIdTag.textContent.trim();
                        // प्लेयर में नई लाइव वीडियो सेट करें
                        document.getElementById("livePlayer").src = `https://www.youtube.com/embed/${newVideoId}?autoplay=1&mute=0&rel=0`;
                        return;
                    }
                }
            } catch (err) {
                console.log("Auto-detection fallback:", err);
            }
            // अगर कोई दिक्कत आए तो बैकअप ID चलाएं
            document.getElementById("livePlayer").src = `https://www.youtube.com/embed/${defaultVideoId}?autoplay=1&mute=0&rel=0`;
        }

        // पेज खुलते ही अपने-आप चेक करे
        window.onload = checkLiveStream;
    </script>

</body>
</html>
