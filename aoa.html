<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mera Video</title>
<style>
  :root{
    --bg:#101418; --text:#eef1f4; --muted:#9aa5b1; --accent:#3ddc97; --line:#232b33;
    box-sizing:border-box;
  }
  *,*::before,*::after{box-sizing:inherit}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    line-height:1.6;
  }

  /* ---------- VIDEO SECTION ---------- */
  .hero{
    display:flex; justify-content:center;
    padding:20px 16px 8px;
  }
  .player{
    position:relative; width:100%; max-width:380px;
    aspect-ratio:9/16; max-height:82vh;
    border-radius:18px; overflow:hidden; background:#000;
  }
  /* Video ko thoda bada karke upar/neeche ka YouTube title-bar crop kar dete hain */
  .player .frame{
    position:absolute; left:50%; top:50%;
    width:100%; height:100%;
    transform:translate(-50%,-50%) scale(1.18);
    pointer-events:none; /* click nahi hoga -> YouTube logo/link open nahi honge */
  }
  .player iframe{width:100%;height:100%;border:0;display:block}
  /* Transparent cover: user ke click YouTube tak nahi pahunchte */
  .cover{position:absolute; inset:0; z-index:2; background:transparent}
  .sound{
    position:absolute; z-index:3; right:12px; bottom:12px;
    border:0; border-radius:999px; padding:10px 16px;
    background:rgba(0,0,0,.65); color:#fff; font-size:14px; cursor:pointer;
    backdrop-filter:blur(6px);
  }
  .sound:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  /* ---------- CONTENT SECTION (ye sab baad me badal lena) ---------- */
  main{max-width:640px; margin:0 auto; padding:24px 20px 56px}
  h1{font-size:clamp(1.6rem,5vw,2.2rem); line-height:1.2; margin:8px 0 12px}
  p{color:var(--muted); margin:0 0 16px}
  .btn{
    display:inline-block; background:var(--accent); color:#06281a;
    padding:12px 22px; border-radius:10px; font-weight:600; text-decoration:none;
  }
  hr{border:0; border-top:1px solid var(--line); margin:36px 0}
  h2{font-size:1.2rem; margin:0 0 8px}
  footer{color:var(--muted); font-size:.85rem; text-align:center; padding:0 20px 32px}
</style>
</head>
<body>

<!-- ======== VIDEO ======== -->
<section class="hero">
  <div class="player">
    <div class="frame"><div id="yt"></div></div>
    <div class="cover"></div>
    <button class="sound" id="soundBtn" type="button">🔇 Sound chalu karein</button>
  </div>
</section>

<!-- ======== CONTENT: yahan apna text likho ======== -->
<main>
  <h1>Yahan apna heading likhein</h1>
  <p>Ye placeholder text hai. Baad me isse apne asli content se badal dena &mdash; apne baare me, product ya service ke baare me kuch bhi.</p>
  <a class="btn" href="#">Contact karein</a>

  <hr>

  <h2>Dusra section</h2>
  <p>Yahan aur details, prices, ya links add kar sakte ho.</p>
</main>

<footer>&copy; 2026 Aapka Naam</footer>

<script>
  // Sirf yahan video ID badalna hai
  var VIDEO_ID = "Jvwqogggpq0";

  var player;
  var tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);

  function onYouTubeIframeAPIReady(){
    player = new YT.Player("yt", {
      videoId: VIDEO_ID,
      playerVars: {
        autoplay:1, mute:1, controls:0, loop:1, playlist:VIDEO_ID,
        rel:0, modestbranding:1, playsinline:1, iv_load_policy:3,
        fs:0, disablekb:1, cc_load_policy:0, origin:location.origin
      },
      events:{ onReady:function(e){ e.target.mute(); e.target.playVideo(); } }
    });
  }

  // Browser autoplay ke liye video muted shuru hota hai; button se sound on/off
  var btn = document.getElementById("soundBtn");
  btn.addEventListener("click", function(){
    if(!player) return;
    if(player.isMuted()){ player.unMute(); player.setVolume(100); btn.textContent = "🔊 Sound band karein"; }
    else{ player.mute(); btn.textContent = "🔇 Sound chalu karein"; }
    player.playVideo();
  });
</script>
</body>
</html>
