<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>श्री राधाकृष्ण ई-पुस्तकालय</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;}
        body{background:#0E0F12;color:#F3F4F6;font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding-bottom:60px;}
        .header{background:linear-gradient(135deg,#FF9100,#E65100);padding:18px 20px;color:white;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 4px 15px rgba(0,0,0,0.3);}
        .header h1{font-size:1.15rem;font-weight:700;}
        .btn-back{background:rgba(255,255,255,0.2);border:none;color:white;width:36px;height:36px;border-radius:10px;cursor:pointer;}
        .container{padding:16px;}
        .intro-banner{background:#171920;border:1px solid #282C37;border-radius:16px;padding:16px;margin-bottom:20px;}
        .intro-banner h2{font-size:1rem;color:#FFA726;margin-bottom:4px;}
        .intro-banner p{font-size:0.8rem;color:#9CA3AF;line-height:1.4;}
        
        .book-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
        .book-card{background:#171920;border:1px solid #282C37;border-radius:16px;padding:12px;display:flex;flex-direction:column;box-shadow:0 6px 16px rgba(0,0,0,0.4);}
        
        /* 🪷 रॉयल 3D बुक स्टाइल */
        .cover-box{width:100%;aspect-ratio:3/4;border-radius:10px;background:linear-gradient(135deg,#7A1212,#4A0808);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#FFD54F;box-shadow:0 8px 20px rgba(0,0,0,0.6);position:relative;overflow:hidden;border:2px solid #D4AF37;text-align:center;padding:10px;}
        .cover-box img{width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0;}
        .cover-spine{position:absolute;left:0;top:0;bottom:0;width:7px;background:linear-gradient(90deg,rgba(0,0,0,0.6),transparent);z-index:2;}
        .cover-gold-badge{width:36px;height:36px;border-radius:50%;border:1.5px solid #FFD54F;display:flex;align-items:center;justify-content:center;font-size:1.1rem;margin-bottom:8px;box-shadow:0 0 10px rgba(255,213,79,0.3);}
        .cover-title-text{font-size:0.8rem;font-weight:700;color:#FFF;line-height:1.2;text-shadow:0 1px 3px rgba(0,0,0,0.8);}
        
        .book-title{font-size:0.9rem;font-weight:700;color:#FFF;margin-top:10px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .book-author{font-size:0.75rem;color:#9CA3AF;margin-bottom:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        
        .btn-action{padding:10px;border-radius:10px;font-size:0.8rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;border:none;width:100%;}
        .btn-download{background:#232733;color:#FFA726;border:1px solid #363C4E;}
        .btn-read{background:linear-gradient(135deg,#10B981,#059669);color:white;}
        .btn-action:active{transform:scale(0.96);}
    </style>
</head>
<body onload="initCatalog()">

    <header class="header">
        <button class="btn-back" onclick="window.history.back()"><i class="fas fa-arrow-left"></i></button>
        <h1>📖 श्री राधाकृष्ण ई-पुस्तकालय</h1>
        <div style="width:36px;"></div>
    </header>

    <div class="container">
        <div class="intro-banner">
            <h2>🌸 पावन ग्रन्थ डाउनलोड करें व पढ़ें</h2>
            <p>एक बार डाउनलोड करें और बिना इंटरनेट के कभी भी, कहीं भी अध्ययन करें।</p>
        </div>

        <div class="book-grid" id="catalogGrid"></div>
    </div>

<script>
    // 📚 आपकी असली किताब का 100% सटीक डायरेक्ट डाउनलोड लिंक
    const REAL_CATALOG = [
        {
            id: 'book_1',
            title: 'पावन ग्रन्थ एवं अध्ययन',
            author: 'श्री राधाकृष्ण मंदिर',
            fileName: 'Sex-Samajh-Aur-Sahmati.pdf',
            // 🔥 डायरेक्ट GitHub रॉ लिंक (यह कभी 404 नहीं देगा):
            pdfUrl: 'https://raw.githubusercontent.com/bjendermisra-ops/iskcon-mob/main/public/books/Sex-Samajh-Aur-Sahmati.pdf',
            // कवर इमेज लिंक:
            coverUrl: 'https://raw.githubusercontent.com/bjendermisra-ops/iskcon-mob/main/public/images/file_000000005a24821190f5d0f199f73111', 
            size: '5.2 MB'
        }
    ];

    function initCatalog() {
        const grid = document.getElementById('catalogGrid');
        grid.innerHTML = '';

        let downloadedList = [];
        try {
            if (window.AndroidBridge && window.AndroidBridge.getDownloadedBooksJson) {
                downloadedList = JSON.parse(window.AndroidBridge.getDownloadedBooksJson());
            }
        } catch(e) {}

        REAL_CATALOG.forEach(book => {
            const isDownloaded = downloadedList.some(f => f.fileName === book.fileName);

            grid.innerHTML += `
                <div class="book-card">
                    <div class="cover-box">
                        <div class="cover-spine"></div>
                        <img src="${book.coverUrl}" onerror="this.remove()">
                        <div class="cover-gold-badge"><i class="fas fa-book-quran"></i></div>
                        <div class="cover-title-text">${book.title}</div>
                    </div>
                    <div class="book-title" title="${book.title}">${book.title}</div>
                    <div class="book-author">${book.author}</div>
                    ${isDownloaded ? 
                        `<button class="btn-action btn-read" onclick="openOffline('${book.fileName}')"><i class="fas fa-book-open"></i> ऑफ़लाइन पढ़ें</button>` :
                        `<button class="btn-action btn-download" onclick="startDownload('${book.pdfUrl}', '${book.fileName}', '${book.title}')"><i class="fas fa-download"></i> डाउनलोड (${book.size})</button>`
                    }
                </div>
            `;
        });
    }

    function startDownload(url, file, title) {
        if (window.AndroidBridge && window.AndroidBridge.downloadBook) {
            window.AndroidBridge.downloadBook(url, file, title);
            setTimeout(initCatalog, 2000);
        } else {
            // ब्राउज़र में डायरेक्ट डाउनलोड
            window.open(url, '_blank');
        }
    }

    function openOffline(fileName) {
        if (window.AndroidBridge && window.AndroidBridge.openBook) {
            window.AndroidBridge.openBook(fileName);
        }
    }
</script>
</body>
</html>
