<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>श्री राधाकृष्ण ई-पुस्तकालय</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;}
        body{background:#0E0F12;color:#F3F4F6;font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding-bottom:60px;}
        .header{background:linear-gradient(135deg,#FF9100,#E65100);padding:20px;color:white;display:flex;align-items:center;justify-content:space-between;}
        .header h1{font-size:1.2rem;font-weight:700;}
        .btn-back{background:rgba(255,255,255,0.2);border:none;color:white;width:36px;height:36px;border-radius:10px;cursor:pointer;}
        .container{padding:16px;}
        .intro-banner{background:#171920;border:1px solid #282C37;border-radius:16px;padding:16px;margin-bottom:20px;}
        .intro-banner h2{font-size:1rem;color:#FFA726;margin-bottom:4px;}
        .intro-banner p{font-size:0.8rem;color:#9CA3AF;line-height:1.4;}
        .book-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
        .book-card{background:#171920;border:1px solid #282C37;border-radius:16px;padding:12px;display:flex;flex-direction:column;}
        .cover-box{width:100%;aspect-ratio:3/4;border-radius:12px;background:linear-gradient(135deg,#1F2430,#141720);display:flex;align-items:center;justify-content:center;color:#FFA726;font-size:2.5rem;box-shadow:0 6px 18px rgba(0,0,0,0.4);position:relative;overflow:hidden;}
        .cover-box img{width:100%;height:100%;object-fit:cover;}
        .book-title{font-size:0.9rem;font-weight:700;color:#FFF;margin-top:10px;line-height:1.3;}
        .book-author{font-size:0.75rem;color:#9CA3AF;margin-bottom:12px;}
        .btn-download{background:#232733;color:#FFA726;border:1px solid #363C4E;padding:10px;border-radius:10px;font-size:0.8rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;}
        .btn-download.ready{background:linear-gradient(135deg,#10B981,#059669);color:white;border:none;}
        .btn-download:active{transform:scale(0.96);}
    </style>
</head>
<body onload="initCatalog()">

    <header class="header">
        <button class="btn-back" onclick="window.history.back()"><i class="fas fa-arrow-left"></i></button>
        <h1>📖 श्री राधाकृष्ण ई-पुस्तकालय</h1>
        <div style="width:36px;"></div>
    </header>

    <div class="container">
        <div class="intro-banner">
            <h2>🌸 ग्रन्थ डाउनलोड करें व ऑफ़लाइन पढ़ें</h2>
            <p>एक बार डाउनलोड करें और बिना इंटरनेट के कभी भी, कहीं भी प्रभु के पावन ग्रन्थों का अध्ययन करें।</p>
        </div>

        <div class="book-grid" id="catalogGrid"></div>
    </div>

<script>
    // 📚 यहाँ अपनी पुस्तकों की असली लिस्ट और लिंक डालें!
    // (अपनी PDF और कवर्स को Vercel के public/books/ और public/images/ में डालें)
    const CATALOG = [
        {
            id: 'gita_hindi',
            title: 'श्रीमद्भगवद्गीता यथारूप',
            author: 'श्रील प्रभुपाद',
            fileName: 'shrimad_bhagavad_gita.pdf',
            size: '14 MB',
            // असली PDF लिंक (जब आप Vercel पर डालेंगे):
            pdfUrl: 'https://iskcon-mob.vercel.app/books/gita.pdf',
            // कवर इमेज लिंक:
            coverUrl: 'https://iskcon-mob.vercel.app/images/gita_cover.jpg'
        },
        {
            id: 'aarti_sangrah',
            title: 'नित्य आरती व भजन संग्रह',
            author: 'इस्कॉन मंदिर',
            fileName: 'temple_aarti_sangrah.pdf',
            size: '4 MB',
            pdfUrl: 'https://iskcon-mob.vercel.app/books/aarti.pdf',
            coverUrl: 'https://iskcon-mob.vercel.app/images/aarti_cover.jpg'
        },
        {
            id: 'krishna_leela',
            title: 'श्रीकृष्ण लीला अमृत',
            author: 'श्रील प्रभुपाद',
            fileName: 'krishna_leela_amrit.pdf',
            size: '18 MB',
            pdfUrl: 'https://iskcon-mob.vercel.app/books/krishna.pdf',
            coverUrl: 'https://iskcon-mob.vercel.app/images/krishna_cover.jpg'
        },
        {
            id: 'chaitanya_charit',
            title: 'श्री चैतन्य चरितामृत सार',
            author: 'कृष्णदास कविराज',
            fileName: 'chaitanya_charitamrita.pdf',
            size: '22 MB',
            pdfUrl: 'https://iskcon-mob.vercel.app/books/cc.pdf',
            coverUrl: 'https://iskcon-mob.vercel.app/images/cc_cover.jpg'
        }
    ];

    function initCatalog() {
        const grid = document.getElementById('catalogGrid');
        grid.innerHTML = '';

        let downloadedList = [];
        try {
            if (window.AndroidBridge && window.AndroidBridge.getDownloadedBooksJson) {
                downloadedList = JSON.parse(window.AndroidBridge.getDownloadedBooksJson());
            }
        } catch(e) {}

        CATALOG.forEach(book => {
            const isDownloaded = downloadedList.some(f => f.fileName === book.fileName);

            grid.innerHTML += `
                <div class="book-card">
                    <div class="cover-box">
                        <img src="${book.coverUrl}" onerror="this.style.display='none'; this.parentElement.innerHTML='<i class=\\\'fas fa-book-journal-whills\\\'></i>'">
                    </div>
                    <div class="book-title">${book.title}</div>
                    <div class="book-author">${book.author}</div>
                    ${isDownloaded ? 
                        `<button class="btn-download ready" onclick="openOffline('${book.fileName}')"><i class="fas fa-book-open"></i> ऑफ़लाइन पढ़ें</button>` :
                        `<button class="btn-download" onclick="startDownload('${book.pdfUrl}', '${book.fileName}', '${book.title}')"><i class="fas fa-download"></i> डाउनलोड (${book.size})</button>`
                    }
                </div>
            `;
        });
    }

    function startDownload(url, file, title) {
        if (window.AndroidBridge && window.AndroidBridge.downloadBook) {
            window.AndroidBridge.downloadBook(url, file, title);
            setTimeout(initCatalog, 1500); // डाउनलोड शुरू होने पर बटन रीफ्रेश
        } else {
            // साधारण ब्राउज़र में डाउनलोड
            window.open(url, '_blank');
        }
    }

    function openOffline(fileName) {
        if (window.AndroidBridge && window.AndroidBridge.openBook) {
            window.AndroidBridge.openBook(fileName);
        }
    }
</script>
</body>
</html>
