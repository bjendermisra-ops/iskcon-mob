<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>श्री राधाकृष्ण ई-पुस्तकालय</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;}
        body{background:#0E0F12;color:#F3F4F6;font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding-bottom:60px;}
        .header{background:linear-gradient(135deg,#FF9100,#E65100);padding:20px;color:white;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
        .header h1{font-size:1.15rem;font-weight:700;}
        .btn-back{background:rgba(255,255,255,0.2);border:none;color:white;width:36px;height:36px;border-radius:10px;cursor:pointer;}
        .container{padding:16px;}
        .intro-banner{background:#171920;border:1px solid #282C37;border-radius:16px;padding:16px;margin-bottom:20px;}
        .intro-banner h2{font-size:1rem;color:#FFA726;margin-bottom:4px;}
        .intro-banner p{font-size:0.8rem;color:#9CA3AF;line-height:1.4;}
        
        .book-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
        .book-card{background:#171920;border:1px solid #282C37;border-radius:16px;padding:12px;display:flex;flex-direction:column;box-shadow:0 6px 16px rgba(0,0,0,0.4);}
        .cover-box{width:100%;aspect-ratio:3/4;border-radius:12px;background:linear-gradient(135deg,#1F2430,#141720);display:flex;align-items:center;justify-content:center;color:#FFA726;font-size:2.5rem;box-shadow:0 6px 18px rgba(0,0,0,0.5);position:relative;overflow:hidden;}
        .cover-box img{width:100%;height:100%;object-fit:cover;}
        .book-title{font-size:0.9rem;font-weight:700;color:#FFF;margin-top:10px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .book-author{font-size:0.75rem;color:#9CA3AF;margin-bottom:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        
        .btn-action{padding:10px;border-radius:10px;font-size:0.8rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;border:none;width:100%;}
        .btn-download{background:#232733;color:#FFA726;border:1px solid #363C4E;}
        .btn-read{background:linear-gradient(135deg,#10B981,#059669);color:white;}
        .btn-action:active{transform:scale(0.96);}
        
        .empty-box{text-align:center;padding:50px 20px;grid-column:span 2;}
        .empty-box i{font-size:3rem;color:#4B5563;margin-bottom:12px;}
        .empty-box p{color:#9CA3AF;font-size:0.9rem;}
        
        .loading-box{text-align:center;padding:40px;grid-column:span 2;color:#FFA726;}
    </style>
</head>
<body onload="loadRealCatalog()">

    <header class="header">
        <button class="btn-back" onclick="window.history.back()"><i class="fas fa-arrow-left"></i></button>
        <h1>📖 श्री राधाकृष्ण ई-पुस्तकालय</h1>
        <div style="width:36px;"></div>
    </header>

    <div class="container">
        <div class="intro-banner">
            <h2>🌸 ग्रन्थ डाउनलोड करें व ऑफ़लाइन पढ़ें</h2>
            <p>एक बार डाउनलोड करें और बिना इंटरनेट के कभी भी, कहीं भी प्रभु के पावन ग्रन्थों का अध्ययन करें।</p>
        </div>

        <div class="book-grid" id="catalogGrid">
            <div class="loading-box"><i class="fas fa-spinner fa-spin fa-2x"></i><br><br>पुस्तकालय लोड हो रहा है...</div>
        </div>
    </div>

<script>
    let realBooks = [];

    // 🌐 असली books.json से किताबें लोड करो
    async function loadRealCatalog() {
        const grid = document.getElementById('catalogGrid');
        try {
            // Vercel के public/books.json से असली डेटा फेच करो
            const res = await fetch('/books.json?v=' + Date.now());
            if (res.ok) {
                realBooks = await res.json();
            } else {
                realBooks = [];
            }
        } catch (e) {
            realBooks = [];
        }

        renderCatalog();
    }

    function renderCatalog() {
        const grid = document.getElementById('catalogGrid');
        grid.innerHTML = '';

        if (!realBooks || realBooks.length === 0) {
            grid.innerHTML = `
                <div class="empty-box">
                    <i class="fas fa-book-open"></i>
                    <p>वर्तमान में कोई पुस्तक उपलब्ध नहीं है। जल्द ही नई पुस्तकें जोड़ी जाएंगी।</p>
                </div>
            `;
            return;
        }

        let downloadedList = [];
        try {
            if (window.AndroidBridge && window.AndroidBridge.getDownloadedBooksJson) {
                downloadedList = JSON.parse(window.AndroidBridge.getDownloadedBooksJson());
            }
        } catch(e) {}

        realBooks.forEach(book => {
            const isDownloaded = downloadedList.some(f => f.fileName === book.fileName);

            grid.innerHTML += `
                <div class="book-card">
                    <div class="cover-box">
                        <img src="${book.coverUrl}" onerror="this.style.display='none'; this.parentElement.innerHTML='<i class=\\\'fas fa-book-journal-whills\\\'></i>'">
                    </div>
                    <div class="book-title" title="${book.title}">${book.title}</div>
                    <div class="book-author">${book.author}</div>
                    ${isDownloaded ? 
                        `<button class="btn-action btn-read" onclick="openOffline('${book.fileName}')"><i class="fas fa-book-open"></i> ऑफ़लाइन पढ़ें</button>` :
                        `<button class="btn-action btn-download" onclick="startDownload('${book.pdfUrl}', '${book.fileName}', '${book.title}')"><i class="fas fa-download"></i> डाउनलोड (${book.size || 'PDF'})</button>`
                    }
                </div>
            `;
        });
    }

    function startDownload(url, file, title) {
        // अगर रिलेटिव पाथ है तो पूरा URL बनाओ
        const fullUrl = url.startsWith('http') ? url : (window.location.origin + url);

        if (window.AndroidBridge && window.AndroidBridge.downloadBook) {
            window.AndroidBridge.downloadBook(fullUrl, file, title);
            setTimeout(renderCatalog, 2000);
        } else {
            // ब्राउज़र में डायरेक्ट ओपन/डाउनलोड
            window.open(fullUrl, '_blank');
        }
    }

    function openOffline(fileName) {
        if (window.AndroidBridge && window.AndroidBridge.openBook) {
            window.AndroidBridge.openBook(fileName);
        }
    }
</script>
</body>
</html>
