<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
<title>श्री श्री राधा कृष्ण चंद्र मंदिर</title>
<style>
:root{--o:#E65100;--o2:#FF9800;--ink:#3e2723;--mut:#8a6a55;--ov:72px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%;background:#FFFDF8;scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#FFFDF8;color:#2c1e16;min-height:100%;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
svg{display:block;fill:currentColor}

/* HEADER */
.hdr{position:sticky;top:0;z-index:20;min-height:60px;padding:env(safe-area-inset-top) clamp(.8rem,2.5vw,2rem) 0;background:rgba(255,253,248,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(230,81,0,.15);display:flex;align-items:center;gap:12px;box-shadow:0 4px 15px rgba(230,81,0,.05)}
.hb{display:flex;align-items:center;gap:4px;height:36px;padding:0 14px 0 8px;border-radius:100px;background:#fff3e8;color:var(--o);font-weight:700;font-size:13px;border:1px solid rgba(230,81,0,.2);flex-shrink:0}
.hb:active{transform:scale(.95)}
.hdot{width:8px;height:8px;border-radius:50%;background:var(--o);box-shadow:0 0 8px rgba(230,81,0,.6);animation:pulse 2s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.5}}
.htitle{font-size:clamp(14px,1.4vw + 9px,20px);font-weight:800;letter-spacing:.01em;color:var(--o);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hcount{font-size:12px;font-weight:600;color:var(--mut);margin-left:auto;background:#f5ece4;padding:4px 10px;border-radius:12px;white-space:nowrap;flex-shrink:0}

/* MAIN */
.main{max-width:1240px;margin:0 auto;padding:clamp(1rem,2vw,2rem) clamp(.8rem,2.5vw,2rem) 3rem;width:100%}
.bar{display:flex;flex-direction:column;gap:10px;margin-bottom:1rem}
.search-wrapper{position:relative;flex:1}
.search-input{width:100%;padding:12px 16px 12px 40px;border-radius:12px;border:1px solid rgba(230,81,0,.15);font-size:14px;outline:none;background:#fff;transition:border-color .2s,box-shadow .2s;color:var(--ink)}
.search-input:focus{border-color:var(--o);box-shadow:0 0 0 3px rgba(230,81,0,.1)}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--mut)}
.langs{display:flex;background:#f5ece4;border-radius:12px;padding:3px;gap:2px;flex-shrink:0}
.langs button{flex:1;padding:9px 16px;border-radius:10px;font-size:13px;font-weight:600;color:var(--mut);white-space:nowrap}
.langs button.on{background:#fff;color:var(--o);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.kb{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:1.2rem;border-radius:16px;cursor:pointer;background:linear-gradient(135deg,#FFF3E0,#FFE0B2);border:1px solid rgba(230,81,0,.2);box-shadow:0 4px 12px rgba(230,81,0,.08)}
.kb:active{transform:scale(.98)}
.kd{font-size:30px;line-height:1}
.kb b{display:block;font-size:15px;color:#BF360C}
.kb small{display:block;font-size:12px;color:var(--mut);margin-top:2px;line-height:1.4}
.tabs{display:flex;gap:10px;margin-bottom:1.5rem;overflow-x:auto;scrollbar-width:none;padding-bottom:5px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;height:34px;padding:0 18px;border-radius:100px;font-size:13px;font-weight:600;border:1px solid rgba(230,81,0,.2);background:#fff;color:var(--mut);transition:all .2s;box-shadow:0 2px 5px rgba(0,0,0,.02)}
.tab.on{background:linear-gradient(135deg,var(--o),var(--o2));color:#fff;border-color:transparent;box-shadow:0 4px 10px rgba(230,81,0,.3)}
@media(min-width:700px){.bar{flex-direction:row;align-items:center}.tabs{flex-wrap:wrap;overflow:visible}}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(150px,18vw,250px),1fr));gap:clamp(12px,1.4vw,20px)}
.card{background:#fff;border-radius:16px;overflow:hidden;cursor:pointer;border:1px solid rgba(230,81,0,.08);box-shadow:0 4px 12px rgba(0,0,0,.04);transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column;position:relative}
.card:active{transform:scale(.96)}
@media(hover:hover){.card:hover{transform:translateY(-4px);box-shadow:0 12px 24px rgba(230,81,0,.12)}.card:hover .cthumb img{transform:scale(1.06)}.card:hover .cplay{background:rgba(0,0,0,.25)}.card:hover .cplaybtn{opacity:1;transform:scale(1)}}
.cthumb{position:relative;width:100%;padding-top:56.25%;background:#f5ece4;overflow:hidden}
.cthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .4s}
.cplay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:background .3s}
.cplaybtn{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.6);transition:opacity .2s,transform .2s;color:var(--o)}
.cplaybtn svg{width:18px;height:18px;margin-left:3px}
.cpill,.clang{position:absolute;top:8px;font-size:10px;font-weight:700;padding:4px 10px;border-radius:100px;letter-spacing:.04em;box-shadow:0 2px 8px rgba(0,0,0,.2);color:#fff}
.cpill{left:8px}.clang{right:8px;background:rgba(0,0,0,.6);padding:4px 8px}
.pv{background:rgba(33,33,33,.85)}.ps{background:rgba(211,47,47,.85)}.pl{background:rgba(230,81,0,.9)}.pk{background:rgba(191,54,12,.92)}
.cbody{padding:12px;flex-grow:1;display:flex;flex-direction:column;gap:5px}
.cname{font-size:clamp(13px,.5vw + 9px,15px);font-weight:600;color:var(--ink);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cwho{font-size:11px;color:var(--mut);font-weight:500;line-height:1.3}
.status-msg{grid-column:1/-1;padding:50px 20px;text-align:center;color:var(--o);font-weight:600;background:rgba(230,81,0,.05);border-radius:12px;border:1px solid rgba(230,81,0,.1)}
.foot{text-align:center;color:var(--mut);font-size:12px;padding:28px 0 4px;font-weight:600}

/* PLAYER */
.modal{position:fixed;inset:0;z-index:999;background:#000;display:none;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);color:#fff}
.modal.open{display:flex;animation:fadeIn .25s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.stage{flex:1;min-height:0;position:relative;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center;container-type:size;user-select:none;-webkit-user-select:none}
.stage.nc{cursor:none}
.vbox{position:relative;overflow:hidden;background:#000;aspect-ratio:16/9;width:100%;max-height:100%}
.vbox.v{aspect-ratio:9/16}
@supports (width:1cqw){
.vbox{width:min(100cqw,100cqh*16/9);max-height:none}
.vbox.v{width:min(100cqw,100cqh*9/16)}
.vbox.fill{width:max(100cqw,100cqh*16/9)}
.vbox.v.fill{width:max(100cqw,100cqh*9/16)}}
.vbox iframe,#yti{position:absolute;left:0;top:calc(var(--ov)*-1);width:100%;height:calc(100% + var(--ov)*2);border:0;display:block;pointer-events:none}
.poster{position:absolute;inset:0;z-index:2;background:#000 center/cover no-repeat;transition:opacity .4s}
.poster.off{opacity:0;pointer-events:none}
.clk{position:absolute;inset:0;z-index:4;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.cflash{width:76px;height:76px;border-radius:50%;background:rgba(230,81,0,.7);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.4);transition:opacity .25s,transform .25s;pointer-events:none}
.cflash.show{opacity:1;transform:scale(1)}
.cflash svg{width:36px;height:36px}
.tz{position:absolute;top:0;bottom:0;width:35%;z-index:5;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;pointer-events:none}
.tz.l{left:0}.tz.r{right:0}.tz.on{opacity:1}
.ti{background:rgba(0,0,0,.55);border-radius:50%;width:64px;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.spin{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border:4px solid rgba(255,255,255,.25);border-top-color:var(--o);border-radius:50%;animation:rot 1s linear infinite;z-index:5;pointer-events:none;display:none}
.spin.on{display:block}
@keyframes rot{to{transform:rotate(360deg)}}

/* UP NEXT (YouTube-style autoplay card) */
.end,.err{position:absolute;inset:0;z-index:6;background:rgba(0,0,0,.88);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;color:#f5ece4;font-size:14px;line-height:1.6}
.end.on,.err.on{display:flex}
.err{z-index:8}
.un{width:min(340px,100%);display:flex;flex-direction:column;align-items:center;gap:12px}
.unlbl{font-size:13px;font-weight:700;letter-spacing:.06em;color:#ffcc80;text-transform:uppercase}
.unth{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#222;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.unth img{width:100%;height:100%;object-fit:cover;display:block}
.ring{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45)}
.ring.off{display:none}
.ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3}
.rb{stroke:rgba(255,255,255,.3)}
.rf{stroke:#fff;stroke-linecap:round;stroke-dasharray:119.4;stroke-dashoffset:0;transition:stroke-dashoffset 1s linear}
.ring span{position:absolute;font-size:22px;font-weight:700;color:#fff}
.untt{font-size:15px;font-weight:600;color:#fff;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.big{background:var(--o);color:#fff;padding:11px 24px;border-radius:30px;font-weight:700;text-decoration:none;font-size:14px}
.big.alt{background:rgba(255,255,255,.16)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.top{position:absolute;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:10px;padding:10px 12px 30px;background:linear-gradient(rgba(0,0,0,.85),transparent);transition:opacity .3s}
.ttl{flex:1;min-width:0;font-size:15px;font-weight:600;color:#f5ece4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.14);color:#fff}
.pill{flex-shrink:0;font-size:12px;font-weight:700;padding:7px 12px;border-radius:20px;background:rgba(255,255,255,.14);color:#fff}
.pill.on{background:var(--o)}
.ctrl{position:absolute;left:0;right:0;bottom:0;z-index:10;padding:36px clamp(10px,3vw,24px) clamp(10px,2vh,20px);background:linear-gradient(transparent,rgba(0,0,0,.92));transition:opacity .3s}
.ctrl>*{max-width:1000px;margin-left:auto;margin-right:auto}
.hide{opacity:0;pointer-events:none}
.pr{display:flex;align-items:center;gap:10px}
.tm{font:600 12px/1 'Courier New',monospace;min-width:40px;text-align:center}
.prog{flex:1;height:28px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.trk{position:relative;width:100%;height:5px;border-radius:3px;background:rgba(255,255,255,.25);transition:height .15s}
.prog:hover .trk,.prog.d .trk{height:8px}
.bf,.pf{position:absolute;top:0;bottom:0;left:0;width:0;border-radius:3px}
.bf{background:rgba(255,255,255,.35)}
.pf{background:var(--o);box-shadow:0 0 10px rgba(230,81,0,.8)}
.pd{position:absolute;top:50%;left:0;width:16px;height:16px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 8px rgba(0,0,0,.6)}
.cr{display:flex;align-items:center;gap:2px;margin-top:2px}
.cb{min-width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px;padding:0 6px;transition:background .2s}
.cb:hover{background:rgba(255,255,255,.18)}
.cb:active{transform:scale(.9)}
.cb.on{color:var(--o2)}
.sp{flex:1}
.vol{width:80px;accent-color:var(--o);display:none}
@media(hover:hover) and (min-width:700px){.vol{display:block}}
@media(max-width:430px){.sk{display:none}.cb{min-width:36px}}
.toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;z-index:12;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%;text-align:center}
.toast.on{opacity:1}
</style>
</head>
<body>

<div class="hdr">
  <button class="hb" id="homeBtn" aria-label="Home"><span data-i="back" data-s="20"></span>Home</button>
  <div class="hdot"></div>
  <span class="htitle">श्री श्री राधा कृष्ण चंद्र मंदिर</span>
  <span class="hcount" id="hc">...</span>
</div>

<div class="main">
  <div class="bar">
    <div class="search-wrapper">
      <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path></svg>
      <input type="text" id="searchInput" class="search-input" placeholder="कीर्तन, प्रवचन, प्रभुपाद, कार्तिक खोजें..." autocomplete="off"/>
    </div>
    <div class="langs" id="langs">
      <button data-l="all">सभी</button><button data-l="hi">हिन्दी</button><button data-l="en">English</button>
    </div>
  </div>

  <div class="kb" id="kb">
    <span class="kd">🪔</span>
    <div><b>कार्तिक / दामोदर मास</b><small>दामोदर लीला, दामोदराष्टकम् और कार्तिक कथा — यहाँ सुनें</small></div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab on" data-f="all">All</button>
    <button class="tab" data-f="kartik">🪔 Kartik</button>
    <button class="tab" data-f="lecture">Lectures</button>
    <button class="tab" data-f="P">Prabhupada</button>
    <button class="tab" data-f="L">Lokanath Swami</button>
    <button class="tab" data-f="kirtan">Kirtan</button>
    <button class="tab" data-f="shorts">Shorts</button>
  </div>

  <div class="grid" id="grid"></div>
  <div class="foot">🙏 श्री श्री राधा कृष्ण चंद्र मंदिर — हरे कृष्ण 🙏</div>
</div>

<!-- PLAYER -->
<div class="modal" id="modal">
  <div class="stage" id="stage">
    <div class="vbox" id="vb"><div class="poster" id="poster"></div><div id="yti"></div></div>
    <div class="clk" id="clk"><div class="cflash" id="cf"><svg id="cfi" viewBox="0 0 24 24"></svg></div></div>
    <div class="tz l" id="tzl"><div class="ti"><span data-i="rw"></span>-10s</div></div>
    <div class="tz r" id="tzr"><div class="ti"><span data-i="ff"></span>+10s</div></div>
    <div class="spin" id="spin"></div>

    <div class="end" id="end">
      <div class="un">
        <div class="unlbl" id="unlbl">अगला वीडियो</div>
        <div class="unth" id="unth">
          <img id="unimg" alt=""/>
          <div class="ring" id="ring"><svg viewBox="0 0 44 44"><circle class="rb" cx="22" cy="22" r="19"></circle><circle class="rf" id="rf" cx="22" cy="22" r="19"></circle></svg><span id="rn">5</span></div>
        </div>
        <div class="untt" id="endtxt"></div>
        <div class="row">
          <button class="big alt" id="uncancel">रोकें</button>
          <button class="big" id="endnext">अभी चलाएँ ▶</button>
        </div>
        <button class="big alt" id="replay">↺ दोबारा चलाएँ</button>
      </div>
    </div>
    <div class="err" id="err">
      <div>🙏 यह video embed नहीं हो सकता।</div>
      <div class="row"><a class="big" id="erra" href="#" target="_blank" rel="noopener">YouTube पर खोलें</a><button class="big alt" id="errback">← वापस</button></div>
    </div>

    <div class="top hide" id="top">
      <button class="ib" id="back" aria-label="Back"><span data-i="back"></span></button>
      <span class="ttl" id="bt"></span>
      <button class="pill" id="aut">Autoplay</button>
    </div>

    <div class="ctrl hide" id="ctrl">
      <div class="pr">
        <span class="tm" id="t1">0:00</span>
        <div class="prog" id="prog"><div class="trk"><div class="bf" id="bf"></div><div class="pf" id="pf"></div><div class="pd" id="pd"></div></div></div>
        <span class="tm" id="t2">0:00</span>
      </div>
      <div class="cr">
        <button class="cb" id="bprev" aria-label="Previous"><span data-i="prev"></span></button>
        <button class="cb sk" id="brw" aria-label="-10s"><span data-i="rw" data-s="20"></span></button>
        <button class="cb" id="bpp" aria-label="Play/Pause"><span id="ppi"></span></button>
        <button class="cb sk" id="bff" aria-label="+10s"><span data-i="ff" data-s="20"></span></button>
        <button class="cb" id="bnext" aria-label="Next"><span data-i="next"></span></button>
        <span class="sp"></span>
        <button class="cb" id="spd" aria-label="Speed">1x</button>
        <button class="cb" id="bmute" aria-label="Mute"><span id="mi"></span></button>
        <input class="vol" id="vol" type="range" min="0" max="100" value="100" aria-label="Volume"/>
        <button class="cb" id="bzoom" aria-label="Zoom"><span data-i="zoom"></span></button>
        <button class="cb" id="bfs" aria-label="Fullscreen"><span id="fsi"></span></button>
      </div>
    </div>
    <div class="toast" id="toast"></div>
  </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>

const WHO={P:'श्रील प्रभुपाद',L:'HH लोकनाथ स्वामी महाराज'};
const D=[

['HXRs1LSkGOo','दामोदर अष्टकम् — Kartik Special भजन','kartik','शिवराम दास','hi'],
['cyqonrY8K-c','Damodar Katha Day 9 — Kartik Special (SB 10.9.13-14)','kartik','कार्तिक कथा, उज्जैन','en'],
['Kat6-MBnhKE','Significance of Damodar Month — Damodar Lila','kartik','HG मीनाक्षी देवी दासी','en'],
['3gO-a8Nq40M','Kartik Special: Why We Celebrate Damodar Lila','kartik','ISKCON','en'],
['bVvhrZ2Qcow','Damodar Ashtakam with Lyrics','kartik','Damodar Ashtakam','en'],
['f7mGOuibXj8','Damodar Ashtakam with Lyrics & Meaning','kartik','ISKCON Temple Songs','en'],
/* PRABHUPADA — HINDI */

/* Embed check: jo video embed nahi ho sakta use hide kar do (7 din ka cache) */
async function verify(){
  const todo=all.filter(v=>!(okc[v.id]&&now()-okc[v.id]<7*DAY));let i=0,changed=false;
  const run=async()=>{while(i<todo.length){const v=todo[i++];
    try{const r=await fetch('https://www.youtube.com/oembed?format=json&url='+encodeURIComponent('https://www.youtube.com/watch?v='+v.id));
      if(r.ok)okc[v.id]=now();else if(r.status===401||r.status===403||r.status===404){bad[v.id]=now();changed=true}}catch(e){}}};
  await Promise.all([run(),run(),run(),run()]);
  LS.s('crm_ok',okc);LS.s('crm_bad',bad);
  if(changed){for(let k=all.length-1;k>=0;k--)if(bad[all[k].id])all.splice(k,1);applyFilters()}
}
setTimeout(verify,600);

let yt,ready=false,pending=null,cv=null,idx=-1,playing=false,muted=false,dur=0,ticker=null,hider=null,ctrlOn=false,drag=false,endT=null,lastSave=0;
const modal=$('modal'),stage=$('stage'),vb=$('vb'),ctrl=$('ctrl'),topb=$('top'),clk=$('clk'),prog=$('prog');
const isOpen=()=>modal.classList.contains('open');

window.onYouTubeIframeAPIReady=function(){
  ready=true;
  const vars={autoplay:1,controls:0,rel:0,modestbranding:1,playsinline:1,fs:0,disablekb:1,iv_load_policy:3,cc_load_policy:0,enablejsapi:1};
  if(location.protocol.indexOf('http')===0)vars.origin=location.origin;
  try{yt=new YT.Player('yti',{host:'https://www.youtube.com',playerVars:vars,events:{onReady:onReady,onStateChange:onState,onError:onErr}})}catch(e){console.error(e)}
};
function onReady(){yt.setVolume(vol);if(pending){load(pending.id,pending.s);pending=null}}
function load(id,s){if(ready&&yt&&yt.loadVideoById)yt.loadVideoById({videoId:id,startSeconds:s||0});else pending={id,s}}

function onState(e){
  const S=YT.PlayerState,s=e.data;
  if(s===S.PLAYING){
    playing=true;spin(false);$('poster').classList.add('off');cancelEnd();
    dur=yt.getDuration()||dur;try{yt.setPlaybackRate(rate)}catch(x){}
    setPP();startTicker();showCtrl();
  }else if(s===S.PAUSED){playing=false;setPP();savePos();showCtrl();spin(false)}
  else if(s===S.BUFFERING){spin(true)}
  else if(s===S.ENDED){playing=false;setPP();clearInterval(ticker);onEnded()}
}
function onErr(){
  // embed band / video hata hua -> list se hatao aur agla chalao
  if(!cv)return;
  const gone=cv.id,nxt=nextOf(gone);
  bad[gone]=now();LS.s('crm_bad',bad);
  const i=all.findIndex(v=>v.id===gone);if(i>-1)all.splice(i,1);
  const keep=nxt&&nxt.id!==gone?nxt:null;
  cv=null;applyFilters();
  if(keep){toast('यह video नहीं चल सका — अगला चल रहा है');setTimeout(()=>{if(isOpen())openVideo(keep)},1000)}
  else{playing=false;spin(false);$('erra').href='https://www.youtube.com/watch?v='+gone;$('err').classList.add('on');showCtrl()}
}

function spin(on){$('spin').classList.toggle('on',on)}
function setPP(){$('ppi').innerHTML=svg(playing?P.pause:P.play,28)}
function mIcon(){$('mi').innerHTML=svg(muted||vol==0?P.mute:P.vol)}
function ui(c){$('t1').textContent=fmt(c);$('t2').textContent=fmt(dur);const p=dur?clamp(c/dur,0,1)*100:0;$('pf').style.width=p+'%';$('pd').style.left=p+'%'}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1800)}
function flash(id){const z=$(id);z.classList.add('on');setTimeout(()=>z.classList.remove('on'),400)}
function flashC(p){$('cfi').innerHTML=`<path d="${p}"></path>`;$('cf').classList.add('show');setTimeout(()=>$('cf').classList.remove('show'),400)}

function showCtrl(){ctrl.classList.remove('hide');topb.classList.remove('hide');stage.classList.remove('nc');ctrlOn=true;clearTimeout(hider);if(playing&&!drag)hider=setTimeout(hideCtrl,3500)}

function startTicker(){
  clearInterval(ticker);
  ticker=setInterval(()=>{
    if(!yt||typeof yt.getCurrentTime!=='function'||drag)return;
    const c=yt.getCurrentTime(),d=yt.getDuration();if(d>0)dur=d;ui(c);
    try{$('bf').style.width=(yt.getVideoLoadedFraction()*100)+'%'}catch(x){}
    if(playing&&now()-lastSave>5000)savePos();
  },500);
}
function savePos(){

function skip(s){if(!yt||!dur)return;const t=clamp(yt.getCurrentTime()+s,0,dur-.5);yt.seekTo(t,true);ui(t);showCtrl()}

/* ═════ AUTOPLAY NEXT (YouTube jaisa) ═════
   Video khatam -> "अगला वीडियो" card + 5s countdown -> apne aap next chalu.
   Last video ke baad list dobara shuru se chalti hai (loop). */
function nextOf(id){
  const i=view.findIndex(x=>x.id===id);
  if(view.length<2)return null;
  return view[(i+1)%view.length]; // i=-1 => view[0]
}
function prevOf(id){
  const i=view.findIndex(x=>x.id===id);
  if(view.length<2)return null;
  return view[(i<=0?view.length:i)-1];
}
function step(d){
  if(!cv){return}
  const n=d>0?nextOf(cv.id):prevOf(cv.id);
  if(n)openVideo(n);else toast('कोई और video नहीं है');
}
function cancelEnd(){clearInterval(endT);endT=null;$('end').classList.remove('on')}
function onEnded(){
  if(cv){delete pos[cv.id];LS.s('crm_pos',pos)}
  const n=cv?nextOf(cv.id):null;
  const ring=$('ring'),rf=$('rf'),rn=$('rn'),lbl=$('unlbl'),nb=$('endnext'),cb=$('uncancel');
  clearInterval(endT);
  if(!n){
    $('unth').style.display='none';$('endtxt').textContent='पूरा हुआ 🙏 हरे कृष्ण!';lbl.textContent='';
    nb.style.display='none';cb.style.display='none';
    $('end').classList.add('on');showCtrl();return;
  }
  $('unth').style.display='';nb.style.display='';
  $('unimg').src=thumb(n.id);$('endtxt').textContent=n.name;
  if(!auto){
    lbl.textContent='अगला वीडियो';ring.classList.add('off');cb.style.display='none';
    $('end').classList.add('on');showCtrl();return;
  }
  let c=AUTONEXT_SEC;
  lbl.textContent='अगला वीडियो '+c+' सेकंड में';ring.classList.remove('off');cb.style.display='';
  rn.textContent=c;rf.style.transition='none';rf.style.strokeDashoffset=0;void rf.getBoundingClientRect();rf.style.transition='';
  $('end').classList.add('on');showCtrl();
  requestAnimationFrame(()=>{rf.style.strokeDashoffset=119.4*(1/AUTONEXT_SEC)});
  endT=setInterval(()=>{
    c--;
    if(c<=0){clearInterval(endT);endT=null;openVideo(n);return}
    rn.textContent=c;lbl.textContent='अगला वीडियो '+c+' सेकंड में';
    rf.style.strokeDashoffset=119.4*((AUTONEXT_SEC-c+1)/AUTONEXT_SEC);
  },1000);
}
$('endnext').addEventListener('click',()=>{const n=cv?nextOf(cv.id):null;if(n)openVideo(n)});
$('uncancel').addEventListener('click',()=>{clearInterval(endT);endT=null;$('ring').classList.add('off');$('unlbl').textContent='ऑटोप्ले रुका';$('uncancel').style.display='none'});
$('replay').addEventListener('click',()=>{cancelEnd();if(yt){yt.seekTo(0,true);yt.playVideo()}});

function openVideo(v){
  if(!v||!v.id)return;
  cancelEnd();
  cv=v;idx=view.findIndex(x=>x.id===v.id);
  $('bt').textContent=v.name||'Playing';
  $('erra').href='https://www.youtube.com/watch?v='+v.id;$('err').classList.remove('on');
  vb.classList.toggle('v',v.type==='shorts');setFill(fill);
  const p=$('poster');p.style.backgroundImage=`url(${thumb(v.id)})`;p.classList.remove('off');
  if(!isOpen()){history.pushState({p:1},'');modal.classList.add('open');document.body.style.overflow='hidden'}
  playing=false;dur=0;muted=false;ui(0);$('bf').style.width='0';setPP();mIcon();$('vol').value=vol;$('spd').textContent=rate+'x';
  $('aut').classList.toggle('on',auto);$('aut').textContent=auto?'Autoplay ON':'Autoplay OFF';
  spin(true);showCtrl();
  const r=pos[v.id],st=r&&r.t>10&&(!r.d||r.t<r.d-15)?Math.floor(r.t):0;
  load(v.id,st);if(st)toast('▶ '+fmt(st)+' से जारी');
  if(yt&&yt.unMute&&!muted)try{yt.unMute()}catch(e){}
}
function closeModal(fromPop){
  if(!isOpen())return;
  savePos();cancelEnd();clearInterval(ticker);clearTimeout(hider);
  try{if(yt&&yt.stopVideo)yt.stopVideo()}catch(e){}
  if(document.fullscreenElement||document.webkitFullscreenElement)toggleFS();
  modal.classList.remove('open');document.body.style.overflow='';playing=false;pending=null;cv=null;idx=-1;$('err').classList.remove('on');
  if(fromPop!==true&&history.state&&history.state.p)history.back();
}
window.addEventListener('popstate',()=>{if(isOpen())closeModal(true)});

/* controls wiring */
$('back').addEventListener('click',()=>closeModal());$('errback').addEventListener('click',()=>closeModal());
$('bpp').addEventListener('click',togglePlay);$('brw').addEventListener('click',()=>skip(-10));$('bff').addEventListener('click',()=>skip(10));
$('bprev').addEventListener('click',()=>step(-1));$('bnext').addEventListener('click',()=>step(1));
$('spd').addEventListener('click',cycleRate);$('bmute').addEventListener('click',toggleMute);$('vol').addEventListener('input',e=>setVol(e.target.value));
$('bzoom').addEventListener('click',()=>{setFill(!fill,true);showCtrl()});$('bfs').addEventListener('click',toggleFS);
$('aut').addEventListener('click',()=>{auto=!auto;LS.s('crm_auto',auto);$('aut').classList.toggle('on',auto);$('aut').textContent=auto?'Autoplay ON':'Autoplay OFF';toast(auto?'Autoplay चालू':'Autoplay बंद');if(!auto)cancelEnd()});
ctrl.addEventListener('pointerdown',e=>{e.stopPropagation();showCtrl()});topb.addEventListener('pointerdown',e=>e.stopPropagation());

/* seek bar: drag support (touch + mouse) */
function seekP(e){const r=prog.getBoundingClientRect(),p=clamp((e.clientX-r.left)/r.width,0,1);$('pf').style.width=p*100+'%';$('pd').style.left=p*100+'%';$('t1').textContent=fmt(p*dur);return p}
prog.addEventListener('pointerdown',e=>{if(!dur)return;drag=true;prog.classList.add('d');try{prog.setPointerCapture(e.pointerId)}catch(x){}seekP(e);showCtrl()});
prog.addEventListener('pointermove',e=>{if(drag)seekP(e)});
const endDrag=e=>{if(!drag)return;drag=false;prog.classList.remove('d');const p=seekP(e);if(yt)yt.seekTo(p*dur,true);cancelEnd();showCtrl()};
prog.addEventListener('pointerup',endDrag);prog.addEventListener('pointercancel',()=>{drag=false;prog.classList.remove('d')});

/* gestures: double tap = ±10s | touch: tap = controls | mouse: click = play/pause, double click centre = fullscreen */
let lt=0,tt=null;
clk.addEventListener('pointerup',e=>{
  const r=clk.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,t=now(),touch=e.pointerType!=='mouse';
  if(t-lt<300){clearTimeout(tt);lt=0;
    if(x<.35){skip(-10);flash('tzl')}else if(x>.65){skip(10);flash('tzr')}else if(!touch)toggleFS();
  }else{lt=t;tt=setTimeout(()=>{if(touch){ctrlOn?hideCtrl():showCtrl()}else togglePlay()},280)}
});
stage.addEventListener('mousemove',()=>{if(isOpen())showCtrl()});

/* keyboard (laptop) */
document.addEventListener('keydown',e=>{
  if(!isOpen())return;const k=e.key;
  if(k==='Escape'||k==='b'){closeModal();return}
  if(k===' '||k==='k'){e.preventDefault();togglePlay()}
  else if(k==='ArrowRight'){e.preventDefault();skip(5)}else if(k==='ArrowLeft'){e.preventDefault();skip(-5)}
  else if(k==='l'){skip(10)}else if(k==='j'){skip(-10)}
  else if(k==='ArrowUp'){e.preventDefault();setVol(vol+10)}else if(k==='ArrowDown'){e.preventDefault();setVol(vol-10)}
  else if(k==='m')toggleMute();else if(k==='f')toggleFS();else if(k==='z')setFill(!fill,true);
  else if(k==='n')step(1);else if(k==='p')step(-1);
  else if(k>='0'&&k<='9'&&dur){yt.seekTo(dur*(+k)/10,true)}
});

setLang(lang);
setPP();mIcon();fsIcon();$('vol').value=vol;$('spd').textContent=rate+'x';
</script>
</body>
</html>
