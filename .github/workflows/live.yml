name: check-live

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-live
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check YouTube live status
        env:
          YT_KEY: ${{ secrets.YT_KEY }}
          CH: UC_zm9uW1HqiDFnUa7MBNL7A
        run: |
          IDS=$(curl -s "https://www.youtube.com/feeds/videos.xml?channel_id=$CH" \
            | grep -oP '(?<=<yt:videoId>)[^<]+' | head -10 | paste -sd,)

          if [ -z "$IDS" ]; then echo "RSS empty, skipping"; exit 0; fi

          RESP=$(curl -s "https://www.googleapis.com/youtube/v3/videos?part=snippet&id=$IDS&key=$YT_KEY")

          if ! echo "$RESP" | jq -e '.items' > /dev/null; then
            echo "API error, keeping old live.json"; echo "$RESP"; exit 0
          fi

          LIVE=$(echo "$RESP" | jq -r '[.items[] | select(.snippet.liveBroadcastContent=="live") | .id][0] // ""')
          FALLBACK=${IDS%%,*}

          jq -n --arg live "$LIVE" --arg fb "$FALLBACK" --arg t "$(date -u +%FT%TZ)" \
            '{live:$live, fallback:$fb}' > live.json

          git config user.name "live-bot"
          git config user.email "live-bot@users.noreply.github.com"
          git add live.json
          git commit -m "live status update" || exit 0
          git push
