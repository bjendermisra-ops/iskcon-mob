<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075c60"><title>Bhakti Stickers · ISKCON Hadapsar</title><style>
:root{color-scheme:light;--bg:#faf7ef;--paper:#fff;--ink:#153e43;--muted:#667976;--line:#dce5df;--accent:#07676a;--soft:#e4f2ed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,sans-serif}body.dark{color-scheme:dark;--bg:#101e22;--paper:#192c30;--ink:#eff9f4;--muted:#a7bfba;--line:#355057;--accent:#70dfc9;--soft:#203c3d}header{background:#075c60;color:#fff;padding:20px max(18px,calc((100% - 740px)/2));display:flex;align-items:center;gap:12px}header b{font-size:17px}header small{display:block;color:#b7dcd6;margin-top:4px}button,input{font:inherit}button{cursor:pointer;min-height:44px}button:focus-visible,input:focus-visible{outline:3px solid #d99c39;outline-offset:3px}button{border:1px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink);padding:10px 15px}header button{margin-left:auto}main{max-width:780px;margin:auto;padding:22px 18px 110px}.hero{border:1px solid var(--line);border-radius:24px;padding:25px;background:linear-gradient(120deg,var(--soft),var(--paper));position:relative;overflow:hidden}.hero .art{float:right;font-size:65px;margin:20px 0 0 10px}h1{font-size:34px;line-height:1.2;margin:10px 0}h2{font-size:21px;margin:24px 0 12px}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:800;color:var(--accent)}p{line-height:1.6;color:var(--muted)}input{width:100%;padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--paper);color:var(--ink);margin:20px 0 10px}.categories{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.category{padding:14px 5px;background:var(--soft);font-size:13px}.category span{display:block;font-size:26px;margin-bottom:6px}button[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.filters button{flex:1;font-size:13px}.sectionbar{display:flex;align-items:center;justify-content:space-between;gap:10px}.sectionbar small{color:var(--muted)}.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:18px;margin:0 0 16px}.cardhead{display:flex;gap:10px;align-items:start}.cardhead h3{margin:0 0 6px;font-size:18px}.cardhead small{color:var(--muted)}.save{margin-left:auto}.badge{font-size:10px;letter-spacing:1px;color:var(--accent);font-weight:800;display:block;margin-top:8px}.previews{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:17px 0}.previews img{display:block;width:100%;aspect-ratio:1;object-fit:contain;border-radius:14px;background:var(--bg)}.add{width:100%;background:var(--accent);border:0;color:var(--bg);font-weight:750}.dark .add{color:#102a28}button:disabled{opacity:.5;cursor:wait}.empty{padding:30px;text-align:center;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}#status{padding:14px;background:var(--soft);border-radius:14px;font-size:13px;line-height:1.6;margin:15px 0}footer{text-align:center;font-size:12px;color:var(--muted);padding:25px}nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:12px;background:var(--paper);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:5}nav button{min-width:100px;border:0}#retry{display:block;margin:10px auto}#retry[hidden]{display:none}@media(min-width:650px){#cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{margin:0}.categories{grid-template-columns:repeat(6,1fr)}}@media(prefers-reduced-motion:no-preference){button{transition:background .15s,opacity .15s}}
</style></head><body><header><span aria-hidden="true">🪷</span><div><b>श्री श्री राधा कृष्ण चंद्र मंदिर</b><small>ISKCON Hadapsar</small></div><button id="theme" aria-label="Toggle dark mode">◐</button></header><main><section class="hero"><img class="art" src="./krishna.webp" alt="Krishna" style="width:100px;height:100px;object-fit:contain" onerror="this.hidden=true"><div class="eyebrow">BHAKTI STICKERS</div><h1>हर संदेश में भक्ति</h1><p>Share a little joy.<br>Send a little Krishna.</p></section><input id="q" type="search" placeholder="Search devotional stickers…" aria-label="Search sticker packs"><h2 id="categoryHeading">Categories</h2><div id="categories" class="categories"></div><div id="filters" class="filters" aria-label="Sticker type"></div><div class="sectionbar"><h2 id="heading">Explore packs</h2><small id="count">Loading…</small></div><div id="status" role="status" aria-live="polite">Loading sticker packs…</div><button id="retry" hidden>Try again</button><div id="cards"></div><footer>Made for sharing Krishna’s joy · ISKCON Hadapsar</footer></main><nav aria-label="Main navigation"><button id="explore" aria-pressed="true">⌂ Explore</button><button id="browse">▦ Categories</button><button id="saved" aria-pressed="false">♡ Saved</button></nav><script>
'use strict';
const $=id=>document.getElementById(id),storage={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const initialSaved=storage.get('bhakti.saved',[]);let favorites=new Set(Array.isArray(initialSaved)?initialSaved:[]),packs=[],category='All',type='all',savedOnly=false,pending=null,loadSeq=0;
const icons={'All':'🪷','Bal Krishna':'🦚','Radha Krishna':'🌸','Greetings':'🙏','Festivals':'🪔','Prayers':'📿','Kirtan':'🎶','Spiritual':'🪷','Animated':'✨'};
function node(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function status(msg){$('status').textContent=String(msg)}
function safeURL(value,base=document.baseURI){const u=new URL(value,base);if(!['https:','http:'].includes(u.protocol))throw Error('Invalid image URL');return u.href}
function normalize(data){if(!data||!Array.isArray(data.packs))throw Error('Invalid packs.json: packs array missing');const ids=new Set();return data.packs.map(p=>{if(!p||typeof p.id!=='string'||!p.id||ids.has(p.id)||typeof p.name!=='string'||!Array.isArray(p.stickers)||typeof p.animated!=='boolean')throw Error('Invalid or duplicate pack');ids.add(p.id);const base=safeURL((p.baseUrl||'./').replace(/\/*$/,'/'));return {...p,category:String(p.category||'General'),baseUrl:base,stickers:p.stickers.map(s=>{if(!s||typeof s.file!=='string'||!s.file||s.file.includes('..')||/^[\\/]|[\\?#]/.test(s.file)||s.file.includes(':'))throw Error('Invalid sticker filename');return {...s,image:safeURL(s.image||s.file,base)}})}})}
function controls(){const cats=['All',...new Set(['Bal Krishna','Radha Krishna','Greetings','Festivals','Prayers','Kirtan',...packs.map(p=>p.category)])];if(!cats.includes(category))category='All';$('categories').replaceChildren();cats.forEach(c=>{const b=node('button','category');b.append(node('span','',icons[c]||'🌼'),document.createTextNode(c));b.setAttribute('aria-pressed',c===category);b.onclick=()=>{category=c;controls();render()};$('categories').append(b)});$('filters').replaceChildren();[['all','All packs'],['animated','Animated'],['static','Static']].forEach(([v,label])=>{const b=node('button','',label);b.setAttribute('aria-pressed',type===v);b.onclick=()=>{type=v;controls();render()};$('filters').append(b)})}
function render(){const q=$('q').value.trim().toLocaleLowerCase();const filtered=packs.filter(p=>(category==='All'||p.category===category)&&(type==='all'||p.animated===(type==='animated'))&&(!savedOnly||favorites.has(p.id))&&[p.name,p.category,p.publisher,p.description].join(' ').toLocaleLowerCase().includes(q));$('count').textContent=filtered.length+' packs';$('heading').textContent=savedOnly?'Saved packs':'Explore packs';$('cards').replaceChildren();if(!filtered.length){$('cards').append(node('div','empty','No packs here yet. Try another category or search.'));return}filtered.forEach(p=>{const card=node('article','card'),head=node('div','cardhead'),info=node('div');info.append(node('h3','',p.name),node('small','',p.stickers.length+' stickers · '+(p.publisher||'ISKCON Hadapsar')),node('span','badge',p.animated?'✦ ANIMATED':'STATIC'));const save=node('button','save',favorites.has(p.id)?'♥':'♡');save.setAttribute('aria-label','Save '+p.name);save.setAttribute('aria-pressed',favorites.has(p.id));save.onclick=()=>{favorites.has(p.id)?favorites.delete(p.id):favorites.add(p.id);storage.set('bhakti.saved',[...favorites]);render()};head.append(info,save);const previews=node('div','previews');p.stickers.slice(0,3).forEach((s,i)=>{const img=node('img');img.src=s.image;img.alt=p.name+' sticker '+(i+1);img.loading='lazy';img.decoding='async';img.onerror=()=>{img.replaceWith(node('div','empty','Preview unavailable'))};previews.append(img)});const b=node('button','add',p.available===false?'Files missing':pending&&pending.id===p.id?'Preparing…':'+ Add to WhatsApp');b.disabled=!!pending||p.available===false;if(p.available===false)card.append(node('p','small','This pack is being updated. Missing: '+(p.missingFiles||[]).join(', ')));b.onclick=()=>add(p);card.append(head,previews,b);$('cards').append(card)})}
function finish(msg){if(pending)clearTimeout(pending.timer);pending=null;status(msg);render()}
function add(p){if(pending)return;if(p.available===false){status('Pack files are missing. Please try another pack.');return;}if(p.stickers.length<3||p.stickers.length>30){status('This pack needs 3–30 stickers.');return}const bridge=window.StickerBridge;if(!bridge){status('Open this page inside the ISKCON Android app to add stickers to WhatsApp.');return}if(typeof bridge.addDynamicPack!=='function'&&typeof bridge.addStickerPack!=='function'){status('This app does not expose a supported sticker import method. Please update the Android app.');return}pending={id:p.id,timer:setTimeout(()=>finish('No completion confirmation received. Check the WhatsApp popup before trying again.'),60000)};render();status('Preparing '+p.name+'…');const payload={id:p.id,name:p.name,publisher:p.publisher||'ISKCON Hadapsar',category:p.category,animated:p.animated,baseUrl:p.baseUrl,files:p.stickers.map(s=>s.file),emojis:p.stickers.map(s=>Array.isArray(s.emojis)&&s.emojis.length?s.emojis[0]:'🙏'),tray:p.tray||'',image_data_version:p.image_data_version||'1'};try{if(typeof bridge.addDynamicPack==='function'){bridge.addDynamicPack(JSON.stringify(payload));if(pending)status('Import requested. Complete the confirmation in WhatsApp.')}else{bridge.addStickerPack(p.id,p.name);if(pending)status('Import requested through the older app bridge. New dynamic packs require addDynamicPack support.')}}catch(e){finish('Could not start import: '+e.message)}}
// Existing string callbacks remain supported. They report progress, never imply completion.
// Optional structured callback: {packId, state:'success'|'error'|'cancelled'|'progress', message}.
window.onNativeStatus=function(value){let d=value;if(typeof value==='string'){try{d=JSON.parse(value)}catch{status(value);return}}if(!d||typeof d!=='object')return;if(!pending||d.packId!==pending.id)return;if(['success','error','cancelled'].includes(d.state))finish(d.message||({success:'Pack added to WhatsApp.',error:'Import failed. Please try again.',cancelled:'Import cancelled.'}[d.state]));else status(d.message||'Preparing stickers…')};
async function load(){const seq=++loadSeq;$('retry').hidden=true;status('Loading sticker packs…');const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);try{const r=await fetch('https://raw.githubusercontent.com/bjendermisra-ops/iskcon-mob/main/packs.json?v='+Date.now(),{cache:'no-store',signal:controller.signal});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();const fresh=normalize(data);if(seq!==loadSeq)return;packs=fresh;storage.set('iskcon.stickers.catalog',data);controls();render();status('Choose a pack to add to WhatsApp.')}catch(e){if(seq!==loadSeq)return;try{if(!packs.length)packs=normalize(storage.get('iskcon.stickers.catalog',null))}catch{}controls();render();status(packs.length?'Could not refresh. Showing the last loaded catalog; installation still needs internet.':'Could not load packs.json. Check your connection and try again.');$('retry').hidden=false}finally{clearTimeout(timer)}}
$('q').oninput=render;$('retry').onclick=load;$('explore').onclick=()=>{savedOnly=false;$('explore').setAttribute('aria-pressed',true);$('saved').setAttribute('aria-pressed',false);render()};$('saved').onclick=()=>{savedOnly=true;$('explore').setAttribute('aria-pressed',false);$('saved').setAttribute('aria-pressed',true);render()};$('browse').onclick=()=>$('categoryHeading').scrollIntoView({block:'start'});document.body.classList.toggle('dark',storage.get('bhakti.dark',false));$('theme').onclick=()=>{document.body.classList.toggle('dark');storage.set('bhakti.dark',document.body.classList.contains('dark'))};window.addEventListener('online',load);window.addEventListener('offline',()=>status('You are offline. Sticker installation needs an internet connection.'));load();
</script></body></html>
