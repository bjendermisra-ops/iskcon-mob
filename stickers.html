<script>
'use strict';
const $=id=>document.getElementById(id),TEMPLE='Sri Sri Radha Krishna Chandra Mandir',LANGS=['en','hi','mr'];
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const rw={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
let LI=Math.max(0,LANGS.indexOf(rw.get('lang')));
const S={
title:['Bhakti Stickers','भक्ति स्टिकर्स','भक्ती स्टिकर्स'],temple:[TEMPLE,'श्री श्री राधा कृष्ण चंद्र मंदिर','श्री श्री राधा कृष्ण चंद्र मंदिर'],
eyebrow:['BHAKTI STICKERS','भक्ति स्टिकर्स','भक्ती स्टिकर्स'],h1:['Bhakti in every message','हर संदेश में भक्ति','प्रत्येक संदेशात भक्ती'],
sub:['Share a little joy. Send a little Krishna.','थोड़ी खुशी बाँटें, थोड़ा कृष्ण भेजें।','थोडा आनंद वाटा, थोडा कृष्ण पाठवा.'],
s1:['1 Pick a pack','1 पैक चुनें','1 पॅक निवडा'],s2:['2 Tap Add to WhatsApp','2 Add to WhatsApp दबाएँ','2 Add to WhatsApp दाबा'],s3:['3 Confirm in WhatsApp','3 WhatsApp में पुष्टि करें','3 WhatsApp मध्ये पुष्टी करा'],
search:['Search devotional stickers…','स्टिकर्स खोजें…','स्टिकर्स शोधा…'],cats:['Categories','श्रेणियाँ','श्रेणी'],
all:['All packs','सभी पैक','सर्व पॅक'],anim:['Animated','एनिमेटेड','ॲनिमेटेड'],stat:['Static','स्टैटिक','स्टॅटिक'],
hExp:['Explore packs','सभी पैक','सर्व पॅक'],hSav:['Saved packs','सेव किए पैक','सेव्ह केलेले पॅक'],packs:['packs','पैक','पॅक'],stk:['stickers','स्टिकर्स','स्टिकर्स'],
load:['Loading sticker packs…','स्टिकर पैक लोड हो रहे हैं…','स्टिकर पॅक लोड होत आहेत…'],pick:['Choose a pack to add to WhatsApp.','WhatsApp में जोड़ने के लिए पैक चुनें।','WhatsApp मध्ये जोडण्यासाठी पॅक निवडा.'],
add:['+ Add to WhatsApp','+ WhatsApp में जोड़ें','+ WhatsApp मध्ये जोडा'],prep:['Preparing…','तैयार हो रहा है…','तयार होत आहे…'],stop:['Cancel','रद्द करें','रद्द करा'],
more:['View all','सभी देखें','सर्व पहा'],less:['Show fewer','कम दिखाएँ','कमी दाखवा'],
none:['No packs here yet. Try another category or search.','यहाँ अभी कोई पैक नहीं। दूसरी श्रेणी या खोज आज़माएँ।','येथे अजून पॅक नाहीत. दुसरी श्रेणी किंवा शोध वापरा.'],
noneS:['No saved packs yet. Tap ♡ on a pack to save it.','अभी कोई पैक सेव नहीं। पैक पर ♡ दबाएँ।','अजून पॅक सेव्ह नाहीत. पॅकवर ♡ दाबा.'],
app:['Open this page inside the temple app to add stickers to WhatsApp.','स्टिकर्स जोड़ने के लिए यह पेज मंदिर के ऐप में खोलें।','स्टिकर्स जोडण्यासाठी हे पेज मंदिराच्या ॲपमध्ये उघडा.'],
upd:['Please update the app to add stickers.','स्टिकर्स जोड़ने के लिए ऐप अपडेट करें।','स्टिकर्स जोडण्यासाठी ॲप अपडेट करा.'],
noresp:['No response from the app. Please try again.','ऐप से जवाब नहीं मिला। फिर कोशिश करें।','ॲपकडून उत्तर मिळाले नाही. पुन्हा प्रयत्न करा.'],
fail:['Could not add. Please try again.','जोड़ा नहीं जा सका। फिर कोशिश करें।','जोडता आले नाही. पुन्हा प्रयत्न करा.'],done:['Pack added to WhatsApp ✅','पैक WhatsApp में जुड़ गया ✅','पॅक WhatsApp मध्ये जोडला गेला ✅'],
stale:['Could not refresh. Showing the last loaded packs.','अपडेट नहीं हो सका। पिछले पैक दिख रहे हैं।','अपडेट झाले नाही. मागील पॅक दिसत आहेत.'],
nolo:['Could not load packs. Check your internet and try again.','पैक लोड नहीं हुए। इंटरनेट जाँचें और फिर कोशिश करें।','पॅक लोड झाले नाहीत. इंटरनेट तपासा आणि पुन्हा प्रयत्न करा.'],
retry:['Try again','फिर कोशिश करें','पुन्हा प्रयत्न करा'],off:['You are offline. Adding stickers needs internet.','आप ऑफ़लाइन हैं। स्टिकर्स जोड़ने के लिए इंटरनेट चाहिए।','तुम्ही ऑफलाइन आहात. स्टिकर्स जोडण्यासाठी इंटरनेट हवे.'],
nExp:['Explore','खोजें','शोधा'],nCat:['Categories','श्रेणी','श्रेणी'],nSav:['Saved','सेव','सेव्ह'],back:['Back','वापस','मागे'],
foot:['© 2026 '+TEMPLE+', Hadapsar','© 2026 श्री श्री राधा कृष्ण चंद्र मंदिर, हडपसर','© 2026 श्री श्री राधा कृष्ण चंद्र मंदिर, हडपसर']};
const t=k=>S[k][LI];
const CT={'All':['सभी','सर्व'],'Bal Krishna':['बाल कृष्ण','बाल कृष्ण'],'Radha Krishna':['राधा कृष्ण','राधा कृष्ण'],'Greetings':['शुभकामनाएँ','शुभेच्छा'],'Festivals':['उत्सव','उत्सव'],'Prayers':['प्रार्थना','प्रार्थना'],'Kirtan':['कीर्तन','कीर्तन']};
const tc=c=>LI&&CT[c]?CT[c][LI-1]:c;
const icons={'All':'🪷','Bal Krishna':'🦚','Radha Krishna':'🌸','Greetings':'🙏','Festivals':'🪔','Prayers':'📿','Kirtan':'🎶','Spiritual':'🪷','Animated':'✨'};
const sv0=ls.get('bhakti.saved',[]),fav=new Set(Array.isArray(sv0)?sv0:[]),exp=new Set();
let packs=[],category='All',type='all',savedOnly=false,pending=null,loadSeq=0,sk='load',ready=false;
function node(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function status(m){sk=m;$('status').textContent=S[m]?t(m):m}
function safeURL(v,base=document.baseURI){const u=new URL(v,base);if(!['https:','http:'].includes(u.protocol))throw Error('Invalid URL');return u.href}
const pub=p=>p.publisher&&!/iskcon/i.test(p.publisher)?p.publisher:TEMPLE;
function normalize(data){if(!data||!Array.isArray(data.packs))throw Error('Invalid packs.json');const ids=new Set(),out=[];
data.packs.forEach(p=>{try{if(!p||typeof p.id!=='string'||!p.id||ids.has(p.id)||typeof p.name!=='string'||!Array.isArray(p.stickers)||typeof p.animated!=='boolean')throw 0;
const base=safeURL((p.baseUrl||'./').replace(/\/*$/,'/'));
const st=p.stickers.map(s=>{if(!s||typeof s.file!=='string'||!s.file||s.file.includes('..')||/^[\\/]|[\\?#]/.test(s.file)||s.file.includes(':'))throw 0;return{...s,image:safeURL(s.image||s.file,base)}});
ids.add(p.id);out.push({...p,category:String(p.category||'General'),baseUrl:base,stickers:st})}catch{}});
if(!out.length)throw Error('No valid packs');return out}
function apply(){document.documentElement.lang=LANGS[LI];document.title=t('title')+' · '+t('temple');
document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
$('q').placeholder=t('search');$('back').setAttribute('aria-label',t('back'));
$('steps').replaceChildren(...['s1','s2','s3'].map(k=>node('span','',t(k))));
$('retry').textContent=t('retry');$('stop').textContent=t('stop');$('foot').textContent=t('foot');
$('explore').textContent='⌂ '+t('nExp');$('browse').textContent='▦ '+t('nCat');$('saved').textContent='♡ '+t('nSav');
document.querySelectorAll('.lg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===LANGS[LI]));status(sk)}
function controls(){const cats=['All',...new Set(['Bal Krishna','Radha Krishna','Greetings','Festivals','Prayers','Kirtan',...packs.map(p=>p.category)])];if(!cats.includes(category))category='All';
$('categories').replaceChildren(...cats.map(c=>{const b=node('button','category');b.append(node('span','',icons[c]||'🌼'),document.createTextNode(tc(c)));b.setAttribute('aria-pressed',c===category);b.onclick=()=>{category=c;controls();render()};return b}));
$('filters').replaceChildren(...[['all','all'],['animated','anim'],['static','stat']].map(([v,k])=>{const b=node('button','',t(k));b.setAttribute('aria-pressed',type===v);b.onclick=()=>{type=v;controls();render()};return b}))}
function render(){if(!ready)return;const q=$('q').value.trim().toLocaleLowerCase();
const list=packs.filter(p=>p.available!==false&&(category==='All'||p.category===category)&&(type==='all'||p.animated===(type==='animated'))&&(!savedOnly||fav.has(p.id))&&[p.name,p.category,pub(p),p.description].filter(Boolean).join(' ').toLocaleLowerCase().includes(q));
$('count').textContent=list.length+' '+t('packs');$('heading').textContent=t(savedOnly?'hSav':'hExp');$('stop').hidden=!pending;
const box=$('cards');box.replaceChildren();
if(!list.length){box.append(node('div','empty',t(savedOnly&&!fav.size?'noneS':'none')));return}
list.forEach(p=>{const card=node('article','card'),head=node('div','cardhead'),info=node('div'),open=exp.has(p.id);
info.append(node('h3','',p.name),node('small','',p.stickers.length+' '+t('stk')+' · '+pub(p)),node('span','badge',p.animated?'✦ '+t('anim').toUpperCase():t('stat').toUpperCase()));
const sv=node('button','save',fav.has(p.id)?'♥':'♡');sv.setAttribute('aria-label','Save '+p.name);sv.setAttribute('aria-pressed',fav.has(p.id));
sv.onclick=()=>{fav.has(p.id)?fav.delete(p.id):fav.add(p.id);ls.set('bhakti.saved',[...fav]);render()};head.append(info,sv);
const pv=node('div','previews');p.stickers.slice(0,open?p.stickers.length:3).forEach((s,i)=>{const im=node('img');im.src=s.image;im.alt=p.name+' sticker '+(i+1);im.loading='lazy';im.decoding='async';im.onerror=()=>im.replaceWith(node('div','ph','—'));pv.append(im)});
card.append(head,pv);
if(p.stickers.length>3){const m=node('button','more',open?t('less'):t('more')+' '+p.stickers.length);m.onclick=()=>{open?exp.delete(p.id):exp.add(p.id);render()};card.append(m)}
const b=node('button','add',pending&&pending.id===p.id?t('prep'):t('add'));b.disabled=!!pending;b.onclick=()=>add(p);card.append(b);box.append(card)})}
/* Add flow: "Preparing" is cleared when the user comes back from WhatsApp (cancel or done) */
function finish(m){if(pending){clearTimeout(pending.tm);pending=null}status(m||'pick');render()}
function arm(){if(pending){clearTimeout(pending.tm);pending.tm=setTimeout(()=>finish('noresp'),30000)}}
function add(p){if(pending)return;
if(p.stickers.length<3||p.stickers.length>30){status('This pack needs 3–30 stickers.');return}
const br=window.StickerBridge;if(!br){status('app');return}
if(typeof br.addDynamicPack!=='function'&&typeof br.addStickerPack!=='function'){status('upd');return}
pending={id:p.id,left:0,at:0,tm:0};arm();status('prep');render();
const payload={id:p.id,name:p.name,publisher:pub(p),category:p.category,animated:p.animated,baseUrl:p.baseUrl,files:p.stickers.map(s=>s.file),emojis:p.stickers.map(s=>Array.isArray(s.emojis)&&s.emojis.length?s.emojis[0]:'🙏'),tray:p.tray||'',image_data_version:p.image_data_version||'1'};
try{if(typeof br.addDynamicPack==='function')br.addDynamicPack(JSON.stringify(payload));else br.addStickerPack(p.id,p.name)}catch(e){finish('fail')}}
const away=s=>{if(pending&&!pending.left){pending.left=s;pending.at=Date.now()}};
const back=s=>{if(pending&&pending.left&&(pending.left==='v'||s==='v'||Date.now()-pending.at>1200))finish()};
document.addEventListener('visibilitychange',()=>document.hidden?away('v'):back('v'));
addEventListener('blur',()=>away('b'));addEventListener('focus',()=>back('f'));
addEventListener('pageshow',e=>{if(pending&&(e.persisted||pending.left))finish()});
window.onNativeStatus=function(v){let d=v;
if(typeof v==='string'){try{d=JSON.parse(v)}catch{if(pending){if(/cancel|declin|dismiss/i.test(v))finish();else{status(v);arm()}}return}}
if(!d||typeof d!=='object')return;
if(d.state==='success'){finish(d.message||'done');return}
if(!pending||(d.packId&&d.packId!==pending.id))return;
if(d.state==='cancelled')finish();else if(d.state==='error')finish(d.message||'fail');else{status(d.message||'prep');arm()}};
async function load(){const seq=++loadSeq;$('retry').hidden=true;if(!packs.length)status('load');
const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),15000);
try{const r=await fetch('https://raw.githubusercontent.com/bjendermisra-ops/iskcon-mob/main/packs.json?v='+Date.now(),{cache:'no-store',signal:ac.signal});if(!r.ok)throw Error('HTTP '+r.status);
const data=await r.json(),fresh=normalize(data);if(seq!==loadSeq)return;packs=fresh;ls.set('iskcon.stickers.catalog',data);ready=true;controls();render();if(!pending)status('pick')}
catch(e){if(seq!==loadSeq)return;if(!packs.length){try{packs=normalize(ls.get('iskcon.stickers.catalog',null))}catch{}}ready=true;controls();render();if(!pending)status(packs.length?'stale':'nolo');$('retry').hidden=false}
finally{clearTimeout(tm)}}
function tab(s){savedOnly=s;$('explore').setAttribute('aria-pressed',!s);$('saved').setAttribute('aria-pressed',s);render()}
$('q').oninput=render;$('retry').onclick=load;$('stop').onclick=()=>finish();
$('explore').onclick=()=>tab(false);$('saved').onclick=()=>tab(true);
$('browse').onclick=()=>{tab(false);$('categoryHeading').scrollIntoView({block:'start',behavior:'smooth'})};
$('back').onclick=e=>{e.preventDefault();history.length>1?history.back():location.href='index.html'};
document.querySelectorAll('.lg button').forEach(b=>b.onclick=()=>{LI=LANGS.indexOf(b.dataset.l);rw.set('lang',b.dataset.l);apply();controls();render()});
const th=()=>{$('theme').textContent=document.body.dataset.theme==='dark'?'☀️':'🌙'};
document.body.dataset.theme=rw.get('theme')==='dark'?'dark':'light';th();
$('theme').onclick=()=>{const d=document.body.dataset.theme!=='dark';document.body.dataset.theme=d?'dark':'light';rw.set('theme',d?'dark':'light');th()};
addEventListener('online',load);addEventListener('offline',()=>status('off'));
apply();load();
</script></body></html>
