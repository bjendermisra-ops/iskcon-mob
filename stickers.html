if(!out.length)throw Error('No valid packs');return out}
function apply(){document.documentElement.lang=LANGS[LI];document.title=t('title')+' · '+t('temple');
document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
$('q').placeholder=t('search');$('back').setAttribute('aria-label',t('back'));$('lang').textContent=['EN','हि','म'][LI];
$('steps').replaceChildren(...[['👆','s1'],['💬','s2'],['✅','s3']].map(([e,k],i)=>{const d=node('div','step n'+i);d.append(node('span','',e),node('b','',(i+1)+'. '+t(k)));return d}));
$('share').textContent='📤 '+t('share');$('foot').textContent=t('foot');
[['explore','🏠','nExp'],['browse','🧩','nCat'],['saved','❤️','nSav']].forEach(([id,i,k])=>$(id).replaceChildren(node('span','ni',i),node('span','',t(k))));
status(sk,sa)}
function controls(){const cats=['All',...new Set(['Bal Krishna','Radha Krishna','Greetings','Festivals','Prayers','Kirtan',...packs.map(p=>p.category)])];if(!cats.includes(category))category='All';
$('categories').replaceChildren(...cats.map((c,i)=>{const b=node('button','category');b.style.setProperty('--h',HUE[i%HUE.length]);b.append(node('span','',icons[c]||'🌼'),document.createTextNode(tc(c)));b.setAttribute('aria-pressed',c===category);b.onclick=()=>{category=c;controls();render()};return b}));
$('filters').replaceChildren(...[['all','all'],['animated','anim'],['static','stat']].map(([v,k])=>{const b=node('button','',t(k));b.setAttribute('aria-pressed',type===v);b.onclick=()=>{type=v;controls();render()};return b}))}
function render(){if(!ready)return;const q=$('q').value.trim().toLocaleLowerCase();
const list=packs.filter(p=>p.available!==false&&(category==='All'||p.category===category)&&(type==='all'||p.animated===(type==='animated'))&&(!savedOnly||fav.has(p.id))&&[p.name,pn(p),p.category,lf(p,'description')].filter(Boolean).join(' ').toLocaleLowerCase().includes(q));
$('count').textContent=list.length+' '+t('packs');$('heading').textContent=t(savedOnly?'hSav':'hExp');
const box=$('cards');box.replaceChildren();
if(!list.length){box.append(node('div','empty',t(savedOnly&&!fav.size?'noneS':'none')));return}
list.forEach(p=>{const card=node('article','card'),head=node('div','cardhead'),info=node('div','ci'),busy=pending&&pending.id===p.id;
info.append(node('h3','',pn(p)),node('span','chip',(p.animated?'✦ '+t('anim'):t('stat'))+' · '+p.stickers.length+' '+t('stk')));
const sv=node('button','save',fav.has(p.id)?'♥':'♡');sv.setAttribute('aria-label','Save');sv.setAttribute('aria-pressed',fav.has(p.id));
sv.onclick=()=>{fav.has(p.id)?fav.delete(p.id):fav.add(p.id);ls.set('bhakti.saved',[...fav]);render()};head.append(info,sv);card.append(head);
const d=lf(p,'description');if(d)card.append(node('p','pd',d));
const st=node('div','strip');p.stickers.forEach((s,i)=>{const b=node('button'),im=node('img');im.src=s.image;im.alt=pn(p)+' '+(i+1);im.loading='lazy';im.decoding='async';im.onerror=()=>b.replaceChildren(node('span','','—'));b.append(im);b.onclick=()=>zoom(p,s);st.append(b)});card.append(st);
const a=node('button','add'+(busy?' busy':''));if(busy)a.append(node('i','sp'),document.createTextNode(t('prep')+'  ✕'));else a.textContent='💬 '+t('add');
a.disabled=!!pending&&!busy;a.onclick=busy?()=>finish():()=>add(p);card.append(a);box.append(card)})}
function zoom(p,s){$('lbi').src=s.image;$('lbn').textContent=pn(p);const a=$('lba');a.textContent='💬 '+t('add');a.disabled=!!pending;a.onclick=()=>{zoomOff();add(p)};$('lb').hidden=false}
function zoomOff(){$('lb').hidden=true}
$('lb').onclick=e=>{if(e.target===$('lb')||e.target===$('lbx'))zoomOff()};
/* Add flow: Preparing is cleared on cancel/close/return from WhatsApp */
function finish(m){if(pending){clearTimeout(pending.tm);clearInterval(pending.iv);pending=null}status(m||'pick');render()}
function arm(){if(pending){clearTimeout(pending.tm);pending.tm=setTimeout(()=>finish('noresp'),20000)}}
function chk(){if(!pending)return;if(!document.hasFocus())pending.left=1;else if(pending.left&&Date.now()-pending.t0>1500)finish()}
function add(p){if(pending)return;
if(p.stickers.length<3||p.stickers.length>30){status('need3');return}
const br=window.StickerBridge;if(!br){status('app');return}
if(typeof br.addDynamicPack!=='function'&&typeof br.addStickerPack!=='function'){status('upd');return}
try{navigator.vibrate&&navigator.vibrate(15)}catch{}
pending={id:p.id,t0:Date.now(),left:0,ns:0,tm:0,iv:setInterval(chk,400)};arm();status('prep',['stop',()=>finish()]);render();
const payload={id:p.id,name:p.name,publisher:pub(p),category:p.category,animated:p.animated,baseUrl:p.baseUrl,files:p.stickers.map(s=>s.file),emojis:p.stickers.map(s=>Array.isArray(s.emojis)&&s.emojis.length?s.emojis[0]:'🙏'),tray:p.tray||'',image_data_version:p.image_data_version||'1'};
try{if(typeof br.addDynamicPack==='function')br.addDynamicPack(JSON.stringify(payload));else br.addStickerPack(p.id,p.name)}catch(e){finish('fail')}}
function wake(){syncLang();if(pending&&pending.left&&Date.now()-pending.t0>1000)finish()}
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(pending)pending.left=1}else wake()});
addEventListener('focus',wake);addEventListener('pageshow',wake);addEventListener('blur',()=>{if(pending)pending.left=1});
addEventListener('storage',e=>{if(e.key==='lang'||e.key==='theme')syncLang()});
document.addEventListener('pointerdown',()=>{if(pending&&Date.now()-pending.t0>2500&&Date.now()-pending.ns>4000)finish()},true);
window.onNativeStatus=function(v){let d=v;
if(typeof v==='string'){try{d=JSON.parse(v)}catch{if(pending){if(/cancel|declin|dismiss/i.test(v))finish();else{pending.ns=Date.now();status(v,['stop',()=>finish()]);arm()}}return}}
if(!d||typeof d!=='object')return;
if(d.state==='success'){finish(d.message||'done');return}
if(!pending||(d.packId&&d.packId!==pending.id))return;
if(d.state==='cancelled')finish();else if(d.state==='error')finish(d.message||'fail');else{pending.ns=Date.now();status(d.message||'prep',['stop',()=>finish()]);arm()}};
async function load(){const seq=++loadSeq;if(!packs.length)status('load');
const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),15000);
try{const r=await fetch('https://raw.githubusercontent.com/bjendermisra-ops/iskcon-mob/main/packs.json?v='+Date.now(),{cache:'no-store',signal:ac.signal});if(!r.ok)throw Error('HTTP '+r.status);
const data=await r.json(),fresh=normalize(data);if(seq!==loadSeq)return;packs=fresh;ls.set('iskcon.stickers.catalog',data);ready=true;controls();render();if(!pending)status('pick')}
catch(e){if(seq!==loadSeq)return;if(!packs.length){try{packs=normalize(ls.get('iskcon.stickers.catalog',null))}catch{}}ready=true;controls();render();if(!pending)packs.length?status('stale'):status('nolo',['retry',load])}
finally{clearTimeout(tm)}}
function tab(s){savedOnly=s;$('explore').setAttribute('aria-pressed',!s);$('saved').setAttribute('aria-pressed',s);render()}
$('q').oninput=render;$('explore').onclick=()=>tab(false);$('saved').onclick=()=>tab(true);
$('browse').onclick=()=>{tab(false);$('categoryHeading').scrollIntoView({block:'start',behavior:'smooth'})};
$('lang').onclick=()=>{LI=(LI+1)%3;rw.set('lang',LANGS[LI]);apply();controls();render()};
$('share').onclick=()=>{const m=t('shareMsg')+'\nhttps://sriradha.vercel.app/app';if(navigator.share)navigator.share({text:m}).catch(()=>{});else{try{navigator.clipboard.writeText(m);status('copied')}catch{status(m)}}};
const th=()=>{$('theme').textContent=document.body.dataset.theme==='dark'?'☀️':'🌙'};
function syncLang(){const n=Math.max(0,LANGS.indexOf(rw.get('lang')));if(n!==LI){LI=n;apply();controls();render()}const d=rw.get('theme')==='dark'?'dark':'light';if(document.body.dataset.theme!==d){document.body.dataset.theme=d;th()}}
document.body.dataset.theme=rw.get('theme')==='dark'?'dark':'light';th();
$('theme').onclick=()=>{const d=document.body.dataset.theme!=='dark';document.body.dataset.theme=d?'dark':'light';rw.set('theme',d?'dark':'light');th()};
addEventListener('online',load);addEventListener('offline',()=>status('off'));
apply();load();
</script></body></html>
