<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* ===== Donation pages: shared design (seva-mandir, seva-gau, granth-daan, temple-development) ===== */
:root{
  --primary:#E65100; --primary-light:#FF9800; --primary-dark:#BF360C; --gold:#FFB300;
  --accent:#E65100; --accent2:#FF9800; --accent-dark:#BF360C;
  --bg:#FDFBF7; --ink:#1E232A; --muted:#5A626A; --radius:22px; --radius-sm:14px;
  box-sizing:border-box;
}
/* Page ka rang badalna ho to body par class lagayein: theme-gau, theme-granth, theme-dev */
body.theme-gau{--accent:#1B5E20; --accent2:#43A047; --accent-dark:#14461a}
body.theme-granth{--accent:#1565C0; --accent2:#42A5F5; --accent-dark:#0d47a1}
body.theme-dev{--accent:#8D5A12; --accent2:#E0A030; --accent-dark:#6b4309}

*,*::before,*::after{box-sizing:inherit; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
body{
  font-family:'Poppins','Baloo 2','Noto Sans Devanagari',sans-serif; color:var(--ink);
  background:var(--bg) radial-gradient(circle at top right,rgba(255,152,0,.09),transparent 420px);
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
  padding-bottom:calc(30px + env(safe-area-inset-bottom,0px));
}
a{color:inherit; text-decoration:none}
button{font-family:inherit}
:focus-visible{outline:3px solid #8e5cf0; outline-offset:3px}

/* Header */
.header{position:relative; padding:calc(18px + env(safe-area-inset-top,0px)) 18px 48px; color:#fff; overflow:hidden;
  background:linear-gradient(135deg,#872002 0%,#C23608 45%,#E65100 100%);
  border-radius:0 0 32px 32px; box-shadow:0 10px 25px rgba(230,81,0,.25)}
body.theme-gau .header{background:linear-gradient(135deg,#0f3d14 0%,#1B5E20 50%,#2E7D32 100%); box-shadow:0 10px 25px rgba(27,94,32,.25)}
body.theme-granth .header{background:linear-gradient(135deg,#0b2f63 0%,#1565C0 55%,#2f86df 100%); box-shadow:0 10px 25px rgba(21,101,192,.25)}
body.theme-dev .header{background:linear-gradient(135deg,#4a2f05 0%,#8D5A12 50%,#c2861f 100%); box-shadow:0 10px 25px rgba(141,90,18,.25)}
.header::before,.header::after{content:""; position:absolute; border-radius:50%; background:rgba(255,255,255,.07)}
.header::before{width:220px;height:220px; right:-70px; top:-80px}
.header::after{width:140px;height:140px; left:-50px; bottom:-60px}
.top{position:relative; z-index:1; display:flex; align-items:center; justify-content:space-between; gap:10px}
.left{display:flex; align-items:center; gap:12px; min-width:0}
.back{flex:none; width:42px; height:42px; display:grid; place-items:center; border-radius:12px; color:#fff; background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.3); transition:transform .15s}
.back:active{transform:scale(.92)}
.sub{display:block; font-size:10.5px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:#FFE082}
.title{font:800 17px/1.2 'Cinzel','Poppins',sans-serif; letter-spacing:.3px}
.lang{flex:none; display:flex; padding:3px; border-radius:25px; background:rgba(0,0,0,.22); border:1px solid rgba(255,255,255,.25)}
.lang button{border:0; cursor:pointer; padding:5px 11px; border-radius:20px; background:transparent; color:rgba(255,255,255,.85); font:700 11px 'Poppins',sans-serif}
.lang button.on{background:#fff; color:var(--accent-dark); box-shadow:0 2px 8px rgba(0,0,0,.15)}
.hero-txt{position:relative; z-index:1; text-align:center; margin-top:20px}
.hero-ico{width:58px; height:58px; margin:0 auto 8px; display:grid; place-items:center; border-radius:50%; font-size:24px; background:rgba(255,255,255,.2)}
.hero-txt h1{font:800 clamp(1.6rem,7vw,2.1rem)/1.15 'Baloo 2','Noto Sans Devanagari',sans-serif}
.hero-txt p{margin-top:4px; font-size:13px; color:rgba(255,255,255,.88); font-weight:500}

/* Layout */
.wrap{max-width:520px; margin:-22px auto 0; padding:0 16px; position:relative; z-index:2}
.card{background:#fff; border-radius:var(--radius); padding:18px; text-align:center; border:1px solid rgba(0,0,0,.04); border-top:5px solid var(--accent); box-shadow:0 10px 30px rgba(0,0,0,.07); margin-bottom:18px}
.note{background:#FFFDF9; border:1px dashed color-mix(in srgb,var(--accent) 30%,transparent); border-radius:var(--radius-sm); padding:14px 12px; margin-bottom:18px; font-size:13.5px; line-height:1.6; color:#4A3A2A; font-weight:500}
.note i{color:var(--accent); margin-right:4px}

/* QR block */
.qr{background:#111; border-radius:16px; overflow:hidden; border:2px solid #EDE6DD; box-shadow:0 10px 25px rgba(0,0,0,.12); margin:0 auto 14px; max-width:380px; min-height:120px}
.qr img{display:block; width:100%; height:auto; object-fit:contain}
.verified{display:inline-flex; align-items:center; gap:6px; margin-bottom:14px; padding:6px 12px; border-radius:20px; background:#F0FDF4; border:1px solid #BBF7D0; color:#166534; font-size:11.5px; font-weight:700}
.tools{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px}
.tbtn{display:flex; align-items:center; justify-content:center; gap:7px; padding:12px 8px; border:0; border-radius:12px; color:#fff; cursor:pointer; font-size:12.5px; font-weight:800; transition:transform .15s}
.tbtn:active{transform:scale(.95)}
.tbtn.dl{background:linear-gradient(135deg,var(--accent2),var(--accent)); box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 30%,transparent)}
.tbtn.sh{background:#25D366; box-shadow:0 4px 12px rgba(37,211,102,.25)}
.upi{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:14px; padding:10px 14px; background:#F8F9FA; border:1.5px solid #E9ECEF; border-radius:14px}
.upi span{font:800 14px monospace,sans-serif; color:#212529; word-break:break-all; text-align:left}
.copy{flex:none; display:inline-flex; align-items:center; gap:6px; padding:9px 15px; border:0; border-radius:10px; color:#fff; cursor:pointer; font-size:12px; font-weight:800; background:linear-gradient(135deg,var(--accent),var(--accent-dark)); transition:transform .15s}
.copy:active{transform:scale(.92)}
.apps{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:16px}
.app{display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 6px; border:1.5px solid #DEE2E6; border-radius:12px; background:#fff; color:#333; cursor:pointer; font-size:12px; font-weight:800; transition:transform .15s,border-color .15s}
.app:active{transform:scale(.94); border-color:var(--accent)}
.app i{font-size:18px}
.payall{width:100%; display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:12px; padding:14px; border:0; border-radius:14px; color:#fff; cursor:pointer; font-size:14px; font-weight:900; background:linear-gradient(135deg,var(--accent2),var(--accent)); box-shadow:0 4px 16px color-mix(in srgb,var(--accent) 35%,transparent); transition:transform .15s}
.payall:active{transform:scale(.96)}
.guide{text-align:left; margin-bottom:6px; padding:12px 12px 8px; border-radius:var(--radius-sm); background:color-mix(in srgb,var(--accent) 7%,#fff); border:1.5px dashed color-mix(in srgb,var(--accent) 40%,transparent)}
.guide-t{display:flex; align-items:center; gap:6px; margin-bottom:8px; font-size:12.5px; font-weight:800; color:var(--accent-dark)}
.step{display:flex; align-items:flex-start; gap:8px; margin-bottom:6px; font-size:11.5px; line-height:1.5; color:#3A3A3A; font-weight:600}
.step b{flex:none; width:19px; height:19px; margin-top:1px; display:grid; place-items:center; border-radius:50%; background:var(--accent); color:#fff; font-size:10.5px}

/* Seva list (sirf jaankari) */
.slabs{margin-top:18px; text-align:left}
.slabs-t{display:flex; align-items:center; gap:8px; margin-bottom:12px; font-size:14.5px; font-weight:800; color:var(--accent-dark)}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.slab{display:flex; flex-direction:column; justify-content:space-between; padding:12px 10px; border:1.5px solid #F0E6D8; border-radius:14px; background:#fff; box-shadow:0 3px 10px rgba(0,0,0,.03); user-select:none}
.slab.full{grid-column:1/-1}
.slab h4{margin-bottom:6px; font-size:11.5px; font-weight:700; line-height:1.3; color:#555}
.amt{font-size:16px; font-weight:900; color:var(--accent-dark)}
.slab p{margin-top:4px; font-size:11.5px; font-weight:600; color:var(--muted); line-height:1.4}
.rows{display:grid; gap:6px; margin-top:2px}
.row{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 10px; border-radius:10px; background:color-mix(in srgb,var(--accent) 7%,#fff); font-size:12.5px; font-weight:700; color:#3A3A3A}
.row .amt{font-size:15px}
.perks{margin-top:10px; padding:10px 12px; border-radius:12px; background:#F0FDF4; border:1px solid #BBF7D0}
.perks b{display:block; margin-bottom:4px; font-size:12px; color:#166534}
.perks div{font-size:12px; line-height:1.5; font-weight:600; color:#14532d; margin-top:3px}

/* 80G + links + contact */
.strip{display:flex; align-items:center; gap:10px; margin-bottom:14px; padding:12px 14px; border-radius:16px; background:#F0FDF4; border:1px solid #BBF7D0; color:#166534; font-size:12.5px; font-weight:600; line-height:1.4}
.strip i{flex:none; font-size:18px}
.others{margin-bottom:14px; text-align:center}
.others h3{margin-bottom:10px; font-size:13px; font-weight:800; color:var(--muted)}
.chips{display:flex; flex-wrap:wrap; justify-content:center; gap:8px}
.chips a{padding:8px 14px; border-radius:999px; background:#fff; border:1.5px solid #EDE6DD; font-size:12.5px; font-weight:700; color:var(--ink); box-shadow:0 3px 8px rgba(0,0,0,.04); transition:transform .15s}
.chips a:active{transform:scale(.95)}
.coord{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 16px; background:#fff; border-radius:var(--radius); border:1.5px solid #EDE6DD; box-shadow:0 10px 26px rgba(0,0,0,.06)}
.coord .who{display:flex; align-items:center; gap:12px; min-width:0}
.av{flex:none; width:46px; height:46px; display:grid; place-items:center; border-radius:50%; font-size:19px; color:#872002; background:linear-gradient(135deg,#FFE082,#FFB300)}
.nm{font-size:14.5px; font-weight:800}
.rl{font-size:11.5px; color:var(--muted); font-weight:600}
.ph{font:800 13px monospace; color:var(--primary)}
.acts{display:flex; gap:8px; flex:none}
.acts a{width:38px; height:38px; display:grid; place-items:center; border-radius:10px; background:#FFF3E0; color:var(--primary-dark); border:1px solid rgba(230,81,0,.3); transition:transform .15s}
.acts a.wa{background:#E8F5E9; color:#1B5E20; border-color:rgba(46,125,50,.3)}
.acts a:active{transform:scale(.9)}
.foot{margin-top:18px; text-align:center; font-size:13px; font-weight:600; color:var(--muted)}

/* Toast */
.toast{position:fixed; top:25px; left:50%; z-index:999999; max-width:92vw; padding:10px 22px; border-radius:30px; text-align:center; font-size:13px; font-weight:700; line-height:1.45; color:#fff; background:rgba(20,24,30,.96); border:1px solid var(--gold); box-shadow:0 8px 25px rgba(0,0,0,.3); opacity:0; pointer-events:none; transform:translateX(-50%) translateY(-100px); transition:all .35s ease}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
.toast i{color:#00E676; margin-right:6px}

.fadein{animation:fi .35s ease both}
@keyframes fi{from{opacity:0; transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}

</style>
</head>

<script>
/* ===== Donation pages: shared logic =====
   Har page apna config deta hai:
     window.SEVA   = { upi, name, qr, file, label, msg:{hi,en,mr} }
     window.PAGE_T = { hi:{...}, en:{...}, mr:{...} }   (us page ke text)
*/
(function(){
  "use strict";

  /* ---------- Common text (teeno bhasha) ---------- */
  var COMMON={
    hi:{sub:"पावन समर्पण",title:"श्री श्री राधाकृष्ण चंद्र",
      copy:"कॉपी करें",copied:"UPI ID कॉपी हो गया! 🙏",dl:"QR डाउनलोड करें",sh:"QR व सेवा शेयर करें",
      payall:"अन्य UPI ऐप से दान दें (All UPI)",
      g_title:"बिना लिमिट भुगतान का आसान तरीका",
      g1:"ऊपर से QR डाउनलोड करें (गैलरी में सेव हो जाएगा)",
      g2:"कोई भी UPI ऐप खोलें (PhonePe / Google Pay / Paytm / BHIM)",
      g3:"ऐप में \"Scan QR\" → \"गैलरी / Upload QR\" चुनें, या कॉपी किया हुआ UPI ID खुद डालें",
      g4:"अपनी श्रद्धा अनुसार राशि डालकर भुगतान करें 🙏",
      g80:"सभी दान पर 80G सुविधा उपलब्ध है।",
      others:"अन्य सेवाएं",o_mandir:"मंदिर सेवा",o_gau:"गौ सेवा",o_granth:"ग्रंथ दान",o_dev:"टेंपल डेवलपमेंट",
      role:"मंदिर सेवा एवं दान समन्वयक",
      foot:"॥ हरे कृष्ण हरे कृष्ण कृष्ण कृष्ण हरे हरे ॥",
      toast_open:"UPI ID कॉपी हो गया ✅ ऐप खुल रहा है — 'Scan QR (गैलरी)' या UPI ID paste करें",
      toast_chooser:"UPI ID कॉपी हो गया ✅ अपना UPI ऐप खोलकर UPI ID paste करें या QR स्कैन करें",
      toast_dl:"QR डाउनलोड हो रहा है...",toast_sh:"शेयर किया जा रहा है...",share_title:"श्री श्री राधाकृष्ण चंद्र सेवा"},
    en:{sub:"SACRED SEVA",title:"Sri Sri Radha Krishna Chandra",
      copy:"Copy UPI",copied:"UPI ID copied to clipboard! 🙏",dl:"Download QR",sh:"Share QR & Details",
      payall:"Donate via Any UPI App",
      g_title:"Easy way to pay with no limit",
      g1:"Download the QR above (it saves to your gallery)",
      g2:"Open any UPI app (PhonePe / Google Pay / Paytm / BHIM)",
      g3:"In the app choose \"Scan QR\" → \"Gallery / Upload QR\", or paste the copied UPI ID yourself",
      g4:"Enter the amount of your choice and complete the payment 🙏",
      g80:"80G benefit is available on all donations.",
      others:"Other Sevas",o_mandir:"Temple Seva",o_gau:"Gau Seva",o_granth:"Granth Daan",o_dev:"Temple Development",
      role:"Temple Seva & Donation Coordinator",
      foot:"॥ Hare Krishna Hare Krishna Krishna Krishna Hare Hare ॥",
      toast_open:"UPI ID copied ✅ Opening app — use 'Scan QR (Gallery)' or paste the UPI ID",
      toast_chooser:"UPI ID copied ✅ Open your UPI app and paste the UPI ID or scan the QR",
      toast_dl:"Downloading QR...",toast_sh:"Sharing...",share_title:"Sri Sri Radha Krishna Chandra Seva"},
    mr:{sub:"पावन समर्पण",title:"श्री श्री राधाकृष्ण चंद्र",
      copy:"कॉपी करा",copied:"UPI ID कॉपी केला आहे! 🙏",dl:"QR डाउनलोड करा",sh:"QR व सेवा शेअर करा",
      payall:"इतर UPI ॲपद्वारे दान करा",
      g_title:"मर्यादेशिवाय पेमेंट करण्याची सोपी पद्धत",
      g1:"वरून QR डाउनलोड करा (गॅलरीत सेव्ह होईल)",
      g2:"कोणतेही UPI ॲप उघडा (PhonePe / Google Pay / Paytm / BHIM)",
      g3:"ॲपमध्ये \"Scan QR\" → \"गॅलरी / Upload QR\" निवडा, किंवा कॉपी केलेला UPI ID स्वतः टाका",
      g4:"आपल्या श्रद्धेनुसार रक्कम टाकून पेमेंट करा 🙏",
      g80:"सर्व देणग्यांवर 80G सुविधा उपलब्ध आहे.",
      others:"इतर सेवा",o_mandir:"मंदिर सेवा",o_gau:"गोसेवा",o_granth:"ग्रंथ दान",o_dev:"टेंपल डेव्हलपमेंट",
      role:"मंदिर सेवा आणि देणगी समन्वयक",
      foot:"॥ हरे कृष्ण हरे कृष्ण कृष्ण कृष्ण हरे हरे ॥",
      toast_open:"UPI ID कॉपी केला ✅ ॲप उघडत आहे — 'Scan QR (गॅलरी)' वापरा किंवा UPI ID पेस्ट करा",
      toast_chooser:"UPI ID कॉपी केला ✅ आपले UPI ॲप उघडून UPI ID पेस्ट करा किंवा QR स्कॅन करा",
      toast_dl:"QR डाउनलोड होत आहे...",toast_sh:"शेअर केले जात आहे...",share_title:"श्री श्री राधाकृष्ण चंद्र सेवा"}
  };

  var S=window.SEVA||{}, lang="hi";
  function dict(){ return Object.assign({},COMMON[lang],(window.PAGE_T||{})[lang]); }
  function $(id){ return document.getElementById(id); }

  /* ---------- Language ---------- */
  function setLang(l){
    if(!COMMON[l]) l="hi"; lang=l;
    var d=dict();
    document.documentElement.lang=l;
    [].forEach.call(document.querySelectorAll("[data-t]"),function(el){
      var k=el.getAttribute("data-t"); if(d[k]!==undefined) el.textContent=d[k];
    });
    [].forEach.call(document.querySelectorAll("[data-h]"),function(el){
      var k=el.getAttribute("data-h"); if(d[k]!==undefined) el.innerHTML=d[k];
    });
    [].forEach.call(document.querySelectorAll(".lang button"),function(b){ b.classList.toggle("on",b.getAttribute("data-lang")===l); });
    try{ localStorage.setItem("lang",l); localStorage.setItem("preferred_language",l); }catch(e){}
  }

  /* ---------- Toast ---------- */
  var toastT=0;
  function toast(text){
    var t=$("toast"); if(!t) return;
    $("toast-msg").textContent=text; t.classList.add("show");
    if(navigator.vibrate) navigator.vibrate(40);
    clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove("show"); },2600);
  }

  /* ---------- Copy ---------- */
  function fallbackCopy(text,quiet){
    try{
      var i=document.createElement("input"); i.value=text; document.body.appendChild(i); i.select();
      document.execCommand("copy"); document.body.removeChild(i);
      if(!quiet) toast(dict().copied);
    }catch(e){}
  }
  function copyText(text,quiet){
    if(navigator.clipboard&&window.isSecureContext){
      navigator.clipboard.writeText(text).then(function(){ if(!quiet) toast(dict().copied); },function(){ fallbackCopy(text,quiet); });
    } else fallbackCopy(text,quiet);
  }

  /* ---------- Android bridge helpers ---------- */
  function bridges(){ return [window.AndroidBridge,window.AndroidInterface].filter(Boolean); }
  function callBridge(names,args){
    var bs=bridges();
    for(var b=0;b<bs.length;b++) for(var m=0;m<names.length;m++){
      var fn=bs[b][names[m]];
      if(typeof fn==="function"){
        try{ var r=fn.apply(bs[b],args||[]); if(r!==false) return true; }catch(e){}
      }
    }
    return false;
  }

  /* ---------- Download QR ---------- */
  function downloadQR(){
    toast(dict().toast_dl);
    if(callBridge(["downloadImage"],[S.qr,S.file])) return;
    fetch(S.qr).then(function(r){ return r.blob(); }).then(function(blob){
      var u=URL.createObjectURL(blob), a=document.createElement("a");
      a.href=u; a.download=S.file||"QR.png"; document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(u); },4000);
    }).catch(function(){
      var a=document.createElement("a"); a.href=S.qr; a.target="_blank"; a.rel="noopener"; a.download=S.file||"QR.png";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    });
  }

  /* ---------- Share QR + message ---------- */
  function waFallback(msg){ window.open("https://api.whatsapp.com/send?text="+encodeURIComponent(msg+"\n\n"+S.qr),"_blank"); }
  function shareQR(){
    var msg=(S.msg&&(S.msg[lang]||S.msg.hi))||"";
    toast(dict().toast_sh);
    if(callBridge(["shareImage"],[S.qr,msg])) return;
    if(navigator.share){
      fetch(S.qr).then(function(r){ return r.blob(); }).then(function(blob){
        var f=new File([blob],S.file||"qr.png",{type:blob.type});
        if(navigator.canShare&&navigator.canShare({files:[f]})) navigator.share({files:[f],title:dict().share_title,text:msg});
        else waFallback(msg);
      }).catch(function(){ waFallback(msg); });
    } else waFallback(msg);
  }

  /* ---------- UPI apps: payment link nahi, sirf asli app kholna ----------
     (pre-filled upi://pay link se PhonePe/GPay ki Rs.2000 limit error aati hai) */
  function openApp(pkg){
    copyText(S.upi,true); toast(dict().toast_open);
    if(callBridge(["launchUpiApp","openAppByPackage","launchApp","openApp"],[pkg])) return;
    try{ window.location.href="intent://#Intent;package="+pkg+";end"; }catch(e){}
  }
  function openChooser(){
    copyText(S.upi,true); toast(dict().toast_chooser);
    if(callBridge(["openUpiAppPicker","openUpiChooserOnly","openAppChooser"],[])) return;
    try{ window.location.href="upi://pay"; }catch(e){}
  }

  /* ---------- Click handling (data-act) ---------- */
  document.addEventListener("click",function(e){
    var b=e.target.closest("[data-act]"); if(!b) return;
    var a=b.getAttribute("data-act");
    if(a==="copy") copyText(S.upi);
    else if(a==="download") downloadQR();
    else if(a==="share") shareQR();
    else if(a==="app") openApp(b.getAttribute("data-pkg"));
    else if(a==="chooser") openChooser();
  });
  [].forEach.call(document.querySelectorAll(".lang button"),function(b){
    b.addEventListener("click",function(){ setLang(b.getAttribute("data-lang")); });
  });

  /* ---------- Init ---------- */
  var saved="hi"; try{ saved=localStorage.getItem("lang")||localStorage.getItem("preferred_language")||"hi"; }catch(e){}
  setLang(saved);
  var up=$("upi-text"); if(up&&S.upi) up.textContent=S.upi;
  var qi=$("qr-img"); if(qi&&S.qr) qi.src=S.qr;
})();

</script>
