<style>
:root{--ink:#1a0b3b;--cream:#fff4dc;--pink:#ff2e93;--gold:#ffb800;--teal:#19e3c8;--lilac:#b69cff}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font:500 17px/1.7 Nunito,"Noto Sans Devanagari",system-ui,sans-serif;color:var(--cream);background:var(--ink);
background-image:radial-gradient(circle at 15% 0,#5b1fa8 0,transparent 45%),radial-gradient(circle at 90% 30%,#c4146f55 0,transparent 40%),radial-gradient(circle at 10% 80%,#0aa89655 0,transparent 40%);
padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3,.disp{font-family:"Baloo 2","Noto Sans Devanagari",sans-serif;font-weight:800;line-height:1.1}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}
section{padding:34px 0}
h2{font-size:clamp(28px,7vw,42px);margin-bottom:14px;color:var(--gold);text-shadow:3px 3px 0 var(--pink)}
.bar{position:sticky;top:0;z-index:20;background:var(--ink);border-bottom:3px solid var(--gold);padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;gap:10px;align-items:center}
.bar b{flex:1;font:800 14px/1.2 "Baloo 2","Noto Sans Devanagari",sans-serif;color:var(--gold)}
.back{flex:none;width:40px;height:40px;border-radius:50%;border:3px solid var(--cream);background:var(--pink);color:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:3px 3px 0 var(--gold)}
.back svg{width:22px;height:22px}
.lang{display:flex;gap:6px;flex-shrink:0}
.lang button{font:800 14px "Baloo 2","Noto Sans Devanagari",sans-serif;border:2px solid var(--cream);background:transparent;color:var(--cream);border-radius:99px;padding:4px 12px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--teal);color:var(--ink);border-color:var(--teal)}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hero{text-align:center;padding-top:26px;overflow:hidden}
.pill{display:inline-block;background:var(--pink);color:#fff;font:800 15px "Baloo 2","Noto Sans Devanagari",sans-serif;padding:4px 16px;border-radius:99px;transform:rotate(-3deg);border:3px solid var(--cream)}
h1{font-size:clamp(44px,13vw,84px);margin:14px 0 6px;background:linear-gradient(90deg,var(--gold),var(--pink),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(4px 4px 0 #0008)}
.sub{font-size:20px;color:var(--lilac)}
.art{width:min(84vw,340px);margin:10px auto 0;display:block}
.art .ring{transform-origin:150px 160px;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* IMAGE SLOTS: a slot with no URL is hidden automatically */
.pic{display:none;overflow:hidden;border:4px solid var(--ink);border-radius:20px;background:linear-gradient(135deg,#5b1fa8,#c4146f);aspect-ratio:16/9;box-shadow:5px 5px 0 var(--ink)}
.pic.on{display:block}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic.hero{aspect-ratio:1;width:min(84vw,360px);margin:16px auto 0;border-color:var(--gold);border-radius:50% 50% 26px 26px;box-shadow:9px 9px 0 var(--pink)}
.pic.sq{aspect-ratio:4/3;margin-bottom:14px}
.pic.sc{margin-bottom:14px}
.marq{overflow:hidden;background:var(--gold);color:var(--ink);border-block:3px solid var(--cream);transform:rotate(-1.5deg);margin:6px -10px;white-space:nowrap}
.marq div{display:inline-block;padding:8px 0;font:800 20px "Baloo 2","Noto Sans Devanagari",sans-serif;animation:mq 22s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
.card{background:var(--cream);color:var(--ink);border:3px solid var(--cream);border-radius:22px;padding:18px;box-shadow:7px 7px 0 var(--pink)}
.card h3{font-size:24px;margin-bottom:6px}
.card p+p{margin-top:12px}
.grid{display:grid;gap:22px}
@media(min-width:640px){.g2{grid-template-columns:1fr 1fr}}
.dates .card:nth-child(1){transform:rotate(-1deg);box-shadow:7px 7px 0 var(--gold)}
.dates .card:nth-child(2){transform:rotate(1deg);box-shadow:7px 7px 0 var(--teal)}
.big{font:800 30px/1.1 "Baloo 2","Noto Sans Devanagari",sans-serif;color:var(--pink);margin-bottom:4px}
.status{margin-top:22px;text-align:center;background:var(--teal);color:var(--ink);border:3px solid var(--cream);border-radius:16px;padding:12px;font:800 20px/1.3 "Baloo 2","Noto Sans Devanagari",sans-serif;box-shadow:5px 5px 0 var(--ink)}
.small{font-size:14px;opacity:.85;margin-top:12px;text-align:center}
.tag{font:800 13px "Baloo 2","Noto Sans Devanagari",sans-serif;background:var(--ink);color:var(--gold);padding:2px 10px;border-radius:99px;display:inline-block;margin-bottom:6px}
.glory .card{border-top-width:12px}
.glory .card:nth-child(1){border-top-color:var(--gold)}.glory .card:nth-child(2){border-top-color:var(--teal)}.glory .card:nth-child(3){border-top-color:var(--lilac)}.glory .card:nth-child(4){border-top-color:var(--pink)}
.katha .card{box-shadow:7px 7px 0 var(--teal)}
.katha .card:nth-of-type(2){box-shadow:7px 7px 0 var(--gold)}
.katha .card:nth-of-type(3){box-shadow:7px 7px 0 var(--lilac)}
.lead{margin-bottom:18px;font-size:18px;color:var(--cream)}
.close{margin-top:22px;background:linear-gradient(135deg,var(--pink),#7b3fe4);border:3px solid var(--cream);border-radius:22px;padding:20px;box-shadow:7px 7px 0 var(--gold)}
.close p+p{margin-top:12px}
.steps{list-style:none;padding:0;counter-reset:s;display:grid;gap:14px}
.steps li{counter-increment:s;background:var(--cream);color:var(--ink);border:3px solid var(--cream);border-radius:18px;padding:12px 14px 12px 64px;position:relative;box-shadow:5px 5px 0 var(--teal)}
.steps li::before{content:counter(s);position:absolute;left:12px;top:10px;width:38px;height:38px;border-radius:50%;background:var(--pink);color:#fff;font:800 22px/38px "Baloo 2";text-align:center;border:3px solid var(--ink)}
.mantra{text-align:center;background:linear-gradient(135deg,var(--pink),#7b3fe4);border:3px solid var(--cream);border-radius:26px;padding:24px 16px;box-shadow:8px 8px 0 var(--gold)}
.mantra p{font:800 clamp(20px,5.5vw,28px)/1.35 "Baloo 2","Noto Sans Devanagari",sans-serif}
.quote{font:800 clamp(22px,6vw,32px)/1.25 "Baloo 2","Noto Sans Devanagari",sans-serif;text-align:center;color:var(--teal)}
footer{text-align:center;padding:34px 18px calc(40px + env(safe-area-inset-bottom));background:var(--gold);color:var(--ink);border-top:4px solid var(--cream);margin-top:30px}
footer .disp{font-size:26px}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

k1h:"1. निर्दयी बहेलिया",k1a:"प्राचीन काल में विंध्य पर्वत पर क्रोधन नाम का एक बहेलिया रहता था। नाम के अनुसार ही क्रोध उस पर राज करता था। वह बिना ज़रूरत शिकार करता, चोरी करता, झूठ बोलता, नशा करता और अनेक लोगों को कष्ट देता।",k1b:"उसने धर्म के बारे में कभी एक पल भी नहीं सोचा। इसी तरह वर्ष बीतते गये और बुढ़ापा आ गया, पर उसका मन नहीं बदला।",
k2h:"2. अंतिम समय का भय",k2a:"जब उसके जीवन का अंतिम दिन आया, तब भयानक यमदूत उसके सामने खड़े हो गये। क्रोधन काँप उठा। पहली बार उसे दिखा कि उसके कर्मों ने उसे क्या बना दिया है।",k2b:"वह दौड़कर अंगिरा ऋषि के आश्रम पहुँचा, उनके चरणों में गिरकर रो पड़ा: \"महाराज, मैंने जीवन भर केवल पाप किये हैं। क्या मेरे लिए कोई उपाय है?\"",k2c:"दयालु ऋषि ने उसे उठाकर कहा: \"निराश मत हो। हरि की कृपा किसी भी पाप से बड़ी है। आश्विन शुक्ल की पापांकुशा एकादशी आ गयी है। श्रद्धा से यह व्रत करो, भगवान पद्मनाभ की पूजा करो, उनका नाम जपो और रात भर जागरण करो।\"",
k3h:"3. विष्णुदूत आये",k3a:"क्रोधन ने ठीक वैसा ही किया। उसने उपवास रखा, सच्चे मन से पूजा की, हरि-नाम जपा और आँखों में आँसू लिये रात भर जागरण किया।",k3b:"जब उसका समय आया, तब यमदूत उसे छू भी न सके। उनकी जगह तेजस्वी विष्णुदूत आये, उसे दिव्य विमान में बैठाया और विष्णुलोक ले गये। क्रूर बहेलिया भक्त बन चुका था।",
k4a:"श्रीकृष्ण ने कहा: \"हे युधिष्ठिर, जो श्रद्धा से यह एकादशी करता है, वह पापों से मुक्त होकर परम धाम को प्राप्त होता है। इस कथा को सुनने मात्र से भी हृदय पवित्र हो जाता है।\"",k4b:"पापांकुशा एकादशी की सीख: कभी देर नहीं होती। भगवान की ओर एक सच्चा कदम पूरा जीवन बदल सकता है।",
howH:"व्रत कैसे करें",h1:"<b>दशमी (21 अक्टूबर):</b> सूर्यास्त से पहले एक बार सात्त्विक भोजन करें। प्याज, लहसुन, मांसाहार नहीं।",h2:"<b>सुबह:</b> स्नान करें, भगवान विष्णु के सामने संकल्प लें और उपवास शुरू करें।",h3:"<b>पूजा:</b> पद्मनाभ और माता लक्ष्मी को तुलसी, फूल, दीप और धूप अर्पित करें।",h4:"<b>जप और जागरण:</b> हरे कृष्ण और विष्णु नाम का जप करें, कथा पढ़ें, जागरण करें।",h5:"<b>पारण (23 अक्टूबर):</b> अगली सुबह पारण समय में व्रत खोलें और अन्न या दान दें।",

k1h:"१. निर्दय पारधी",k1a:"प्राचीन काळी विंध्य पर्वतावर क्रोधन नावाचा एक पारधी राहत होता. नावाप्रमाणेच क्रोध त्याच्यावर राज्य करत असे. तो विनाकारण शिकार करी, चोरी करी, खोटे बोले, नशा करी आणि अनेकांना त्रास देई.",k1b:"धर्माचा विचार त्याने कधी क्षणभरही केला नाही. असेच वर्षे गेली आणि म्हातारपण आले, पण त्याचे मन बदलले नाही.",
k2h:"२. अंतकाळाची भीती",k2a:"जेव्हा त्याच्या आयुष्याचा शेवटचा दिवस आला, तेव्हा भयंकर यमदूत त्याच्यासमोर उभे ठाकले. क्रोधन थरथरू लागला. आपल्या कर्मांनी आपल्याला काय बनवले आहे हे त्याला पहिल्यांदाच दिसले.",k2b:"तो धावत अंगिरा ऋषींच्या आश्रमात गेला, त्यांच्या चरणी पडून रडला: \"महाराज, मी आयुष्यभर फक्त पापच केले. माझ्यासाठी काही उपाय आहे का?\"",k2c:"दयाळू ऋषींनी त्याला उठवून सांगितले: \"निराश होऊ नकोस. हरीची कृपा कोणत्याही पापापेक्षा मोठी आहे. आश्विन शुक्ल पापांकुशा एकादशी आली आहे. श्रद्धेने हे व्रत कर, भगवान पद्मनाभांची पूजा कर, त्यांचे नाम जप आणि रात्रभर जागरण कर.\"",
k3h:"३. विष्णुदूत आले",k3a:"क्रोधनाने अगदी तसेच केले. त्याने उपवास केला, मनापासून पूजा केली, हरिनाम जपले आणि डोळ्यांत अश्रू घेऊन रात्रभर जागरण केले.",k3b:"जेव्हा त्याची वेळ आली, तेव्हा यमदूत त्याला स्पर्शही करू शकले नाहीत. त्यांच्या जागी तेजस्वी विष्णुदूत आले, त्याला दिव्य विमानात बसवून विष्णुलोकी घेऊन गेले. क्रूर पारधी भक्त बनला होता.",

const LANGS=["en","hi","mr"];
function pick(){
  try{const q=new URLSearchParams(location.search).get("lang");if(LANGS.includes(q))return q;}catch(e){}
  if(LANGS.includes(window.APP_LANG))return window.APP_LANG;   // app can set window.APP_LANG = "hi" before load
  try{const s=localStorage.getItem("ek_lang");if(LANGS.includes(s))return s;}catch(e){}
  const n=(navigator.languages&&navigator.languages[0]||navigator.language||"en").slice(0,2).toLowerCase();
  return LANGS.includes(n)?n:"en";
}
function status(l){
  const t=T[l],a=CONFIG.fastDate.split("-").map(Number),n=new Date(),
  d=Math.round((new Date(a[0],a[1]-1,a[2])-new Date(n.getFullYear(),n.getMonth(),n.getDate()))/864e5);
  return d>1?t.s0.replace("{n}",d):d==1?t.s1:d==0?t.s2:d==-1?t.s3:t.s4;
}
function setLang(l){
  const t=T[l];document.documentElement.lang=l;
  document.querySelectorAll("[data-i]").forEach(e=>{e.innerHTML=t[e.dataset.i]});
  document.getElementById("status").textContent=status(l);
  document.getElementById("back").setAttribute("aria-label",t.back);
  document.querySelectorAll("[data-l]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l==l));
  const m=document.getElementById("mq");m.textContent=("हरे कृष्ण • HARE KRISHNA • "+t.temple+" • ").repeat(6);
  try{localStorage.setItem("ek_lang",l)}catch(e){}
}
document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>setLang(b.dataset.l));

// Back button: app hook first, then browser history, then CONFIG.backUrl
document.getElementById("back").onclick=()=>{
  if(typeof window.APP_BACK==="function")return window.APP_BACK();
  if(history.length>1)return history.back();
  location.href=CONFIG.backUrl;
};

// Image slots
document.querySelectorAll("[data-img]").forEach(box=>{
  const url=CONFIG.images[box.dataset.img];
  if(!url)return;
  const im=new Image();im.loading="lazy";im.decoding="async";im.alt="";
  im.onload=()=>{box.appendChild(im);box.classList.add("on");
    if(box.dataset.img==="hero")document.getElementById("art").style.display="none";};
  im.src=url;   // if the link is broken, the slot just stays hidden
});

setLang(pick());
