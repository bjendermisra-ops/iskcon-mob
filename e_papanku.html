<head>

<style>
:root{--f:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari","Noto Sans","Nirmala UI","Kohinoor Devanagari",sans-serif;--ink:#1a0b3b;--cream:#fff4dc;--pink:#ff2e93;--gold:#ffb800;--teal:#19e3c8;--lilac:#b69cff}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* native feel: no selection, no callout, no tap flash, no zoom */
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
img{-webkit-user-drag:none;user-drag:none;pointer-events:none}
::-webkit-scrollbar{display:none}
#app{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column}
#scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;touch-action:pan-y;scrollbar-width:none}
button{touch-action:manipulation;font-family:var(--f)}
body{font:500 clamp(15px,4.3vw,17px)/1.7 var(--f);color:var(--cream);background:linear-gradient(160deg,#3a1478,#1a0b3b 55%,#2a0f4a);}
h1,h2,h3,.disp{font-family:var(--f);font-weight:800;line-height:1.1}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}
section{padding:34px 0}
h2{font-size:clamp(26px,7vw,40px);margin-bottom:16px;color:var(--gold)}
html[lang=hi] h1,html[lang=hi] h2,html[lang=hi] h3,html[lang=hi] .big,html[lang=mr] h1,html[lang=mr] h2,html[lang=mr] h3,html[lang=mr] .big{line-height:1.35;letter-spacing:0}
html[lang=hi] h1,html[lang=mr] h1{padding:4px 0;line-height:1.25}
.bar{flex:none;position:relative;z-index:20;background:var(--ink);border-bottom:3px solid var(--gold);padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;gap:10px;align-items:center}
.bar b{flex:1;font:800 14px/1.2 var(--f);color:var(--gold)}
.back{flex:none;width:40px;height:40px;border-radius:50%;border:3px solid var(--cream);background:var(--pink);color:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:3px 3px 0 var(--gold)}
.back svg{width:22px;height:22px}
.lang{display:flex;gap:6px;flex-shrink:0}
.lang button{font:800 14px var(--f);border:2px solid var(--cream);background:transparent;color:var(--cream);border-radius:99px;padding:4px 12px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--teal);color:var(--ink);border-color:var(--teal)}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hero{text-align:center;padding-top:26px;overflow:hidden}
.pill{display:inline-block;background:var(--pink);color:#fff;font:800 15px var(--f);padding:4px 16px;border-radius:99px;transform:rotate(-3deg);border:3px solid var(--cream)}
h1{font-size:clamp(38px,12vw,76px);margin:14px 0 6px;color:var(--gold);text-shadow:3px 3px 0 var(--pink)}
.sub{font-size:20px;color:var(--lilac)}
.art{width:min(84vw,340px);margin:10px auto 0;display:block}
/* GITA CHIP in hero (tap = scroll to Gita card) */
.gchip{display:inline-flex;align-items:center;gap:8px;margin-top:16px;max-width:100%;font:800 clamp(14px,4vw,17px)/1.3 var(--f);color:var(--ink);background:var(--teal);border:3px solid var(--cream);border-radius:99px;padding:9px 16px;cursor:pointer;box-shadow:4px 4px 0 var(--pink);animation:pulse 2.2s ease-in-out infinite}
.gchip:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--pink)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
/* IMAGE SLOTS: a slot with no URL is hidden automatically */
.pic{display:none;overflow:hidden;border:4px solid var(--ink);border-radius:20px;background:linear-gradient(135deg,#5b1fa8,#c4146f);aspect-ratio:16/9;box-shadow:5px 5px 0 var(--ink)}
.pic.on{display:block}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic.hero{aspect-ratio:1;width:min(84vw,360px);margin:16px auto 0;border-color:var(--gold);border-radius:26px;box-shadow:9px 9px 0 var(--pink)}
.pic.sq{aspect-ratio:4/3;margin-bottom:14px}
.pic.sc{margin-bottom:14px}
.marq{overflow:hidden;background:var(--gold);color:var(--ink);border-block:3px solid var(--cream);margin:6px 0;white-space:nowrap}
.marq div{display:inline-block;padding:8px 0;font:800 20px var(--f);animation:mq 32s linear infinite;will-change:transform}
@keyframes mq{to{transform:translate3d(-50%,0,0)}}
.card{background:var(--cream);color:var(--ink);border:3px solid var(--cream);border-radius:22px;padding:18px;box-shadow:7px 7px 0 var(--pink)}
.card h3{font-size:clamp(20px,5.4vw,24px);margin-bottom:6px}
.card p+p{margin-top:12px}
.grid{display:grid;gap:22px}
@media(min-width:640px){.g2{grid-template-columns:1fr 1fr}}
.dates .card:nth-child(1){box-shadow:7px 7px 0 var(--gold)}
.dates .card:nth-child(2){box-shadow:7px 7px 0 var(--teal)}
.big{font:800 clamp(22px,6.4vw,30px)/1.2 var(--f);color:var(--pink);margin-bottom:4px}
.status{margin-top:22px;text-align:center;background:var(--teal);color:var(--ink);border:3px solid var(--cream);border-radius:16px;padding:12px;font:800 20px/1.3 var(--f);box-shadow:5px 5px 0 var(--ink)}
.small{font-size:14px;opacity:.85;margin-top:12px;text-align:center}
.tag{font:800 13px var(--f);background:var(--ink);color:var(--gold);padding:2px 10px;border-radius:99px;display:inline-block;margin-bottom:6px}
.glory .card{border-top-width:12px}
.glory .card:nth-child(1){border-top-color:var(--gold)}.glory .card:nth-child(2){border-top-color:var(--teal)}.glory .card:nth-child(3){border-top-color:var(--lilac)}.glory .card:nth-child(4){border-top-color:var(--pink)}
.katha .card{box-shadow:7px 7px 0 var(--teal)}
.katha .card:nth-of-type(2){box-shadow:7px 7px 0 var(--gold)}
.katha .card:nth-of-type(3){box-shadow:7px 7px 0 var(--lilac)}
.lead{margin-bottom:18px;font-size:18px;color:var(--cream)}
.close{margin-top:22px;background:linear-gradient(135deg,var(--pink),#7b3fe4);border:3px solid var(--cream);border-radius:22px;padding:20px;box-shadow:7px 7px 0 var(--gold)}
.close p+p{margin-top:12px}
.steps{list-style:none;padding:0;counter-reset:s;display:grid;gap:14px}
.steps li{counter-increment:s;background:var(--cream);color:var(--ink);border:3px solid var(--cream);border-radius:18px;padding:12px 14px 12px 64px;position:relative;box-shadow:5px 5px 0 var(--teal)}
.steps li::before{content:counter(s);position:absolute;left:12px;top:10px;width:38px;height:38px;border-radius:50%;background:var(--pink);color:#fff;font:800 22px/38px var(--f);text-align:center;border:3px solid var(--ink)}
.mantra{text-align:center;background:linear-gradient(135deg,var(--pink),#7b3fe4);border:3px solid var(--cream);border-radius:26px;padding:24px 16px;box-shadow:8px 8px 0 var(--gold)}
.mantra p{font:800 clamp(20px,5.5vw,28px)/1.35 var(--f)}
.quote{font:800 clamp(22px,6vw,32px)/1.25 var(--f);text-align:center;color:var(--teal)}
/* GITA PATHAN */
.gita-card{background:linear-gradient(135deg,var(--teal),#7ff5e3);color:var(--ink);border:3px solid var(--cream);border-radius:26px;padding:22px 18px;box-shadow:8px 8px 0 var(--gold);text-align:center;position:relative}
.gita-card .tag{background:var(--ink);color:var(--teal);font-size:14px;padding:3px 14px}
.gita-ico{font-size:44px;line-height:1.2;margin-bottom:2px}
.gita-time{font:800 clamp(30px,9.5vw,46px)/1.2 var(--f);color:var(--ink);margin:6px 0;background:var(--cream);border:3px solid var(--ink);border-radius:16px;padding:6px 10px;display:inline-block;box-shadow:4px 4px 0 var(--pink)}
.gita-card p{margin-top:10px}
.gita-place{font-weight:800;background:rgba(26,11,59,.12);border-radius:14px;padding:8px 12px}
.gita-note{font-size:15px;opacity:.9}
.mapbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;font:800 18px var(--f);color:var(--cream);background:var(--ink);border:3px solid var(--cream);border-radius:99px;padding:12px 16px;cursor:pointer;box-shadow:4px 4px 0 var(--pink)}
.mapbtn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--pink)}
.mapbtn svg{width:22px;height:22px;flex:none}
.share{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;font:800 19px var(--f);color:#fff;background:#1faa59;border:3px solid var(--cream);border-radius:99px;padding:14px 18px;cursor:pointer;box-shadow:5px 5px 0 var(--ink)}
.share:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.share:disabled{opacity:.7}
.share svg{width:24px;height:24px;flex:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;pointer-events:none;z-index:50;max-width:88vw;text-align:center;background:var(--ink);color:var(--cream);border:3px solid var(--gold);border-radius:16px;padding:10px 16px;font:700 15px/1.4 var(--f);transition:opacity .3s,transform .3s}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* gentle reveal */
.rv{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease}
.rv.in{opacity:1;transform:none}
footer{text-align:center;padding:34px 18px calc(40px + env(safe-area-inset-bottom));background:var(--gold);color:var(--ink);border-top:4px solid var(--cream);margin-top:30px}
footer .disp{font-size:26px}
@media(max-width:360px){.wrap{padding:0 14px}.card{padding:14px}.lang button{padding:4px 9px}.bar b{font-size:12px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.rv{opacity:1;transform:none;transition:none}}
</style>
</head>

meanH:"What does the name mean?",meanP:"<b>Papa</b> means sin. <b>Ankusha</b> is the hook a mahout uses to steer an elephant. Just as the hook tames a huge elephant, this Ekadashi reins in the sins we did knowingly or unknowingly and makes us pure. The Puranas call it one of the greatest of all vratas.",
whoH:"Who do we worship?",whoP:"Lord Vishnu in his <b>Padmanabha</b> form (the lotus rises from his navel). Worship Mata Lakshmi along with Him for peace and prosperity. Thursday is also Lord Vishnu's day, so the benefit grows.",
gloryH:"Why is it so powerful?",g1h:"Huge merit",g1:"The Puranas say its fruit equals many Ashwamedha and Surya yajnas.",g2h:"Ancestors uplifted",g2:"Not only you: generations of your mother's, father's and wife's side are blessed.",g3h:"Freedom from fear",g3:"No suffering of Yamaloka. The devotee reaches Vishnu's abode.",g4h:"A calmer mind",g4:"Lust, anger, greed and attachment settle down.",
kathaH:"The Complete Katha",kathaIntro:"Yudhishthira asked Shri Krishna: \"O Madhusudana, what is the glory of the Ashwin Shukla Ekadashi?\" The Lord smiled and said: \"Listen, O king. I will tell you an old story that can wash away even the heaviest sin.\"",
k1h:"1. A hunter without mercy",k1a:"Long ago, on the Vindhya mountain, lived a fowler named Krodhana. His name said it all: anger ruled him. He hunted without need, stole from others, lied, drank and hurt many.",k1b:"He never gave a single thought to dharma. Years passed in this way, and old age came, but his heart did not change.",
k2h:"2. Fear at the last hour",k2a:"When the last day of his life came, the terrifying Yamadutas stood before him. Krodhana trembled. For the first time he saw what his deeds had made of him.",k2b:"He ran to the ashram of Sage Angira, fell at his feet and cried: \"Maharaj, all my life I have done only sin. Is there any way for me?\"",k2c:"The kind sage lifted him up and said: \"Do not lose hope. Hari's mercy is greater than any sin. Papankusha Ekadashi of Ashwin Shukla is here. Keep this vrat with faith, worship Lord Padmanabha, chant His name and stay awake the whole night.\"",
k3h:"3. The Vishnudutas arrive",k3a:"Krodhana did exactly as he was told. He fasted, worshipped with a true heart, chanted the name of Hari and kept jagaran through the night, with tears in his eyes.",k3b:"When his time came, the Yamadutas could not even touch him. Radiant Vishnudutas arrived instead, seated him on a divine vimana and took him to Vishnuloka. The cruel hunter had become a devotee.",
k4a:"Shri Krishna said: \"O Yudhishthira, whoever keeps this Ekadashi with faith is freed from sin and reaches the supreme abode. Even hearing this story purifies the heart.\"",k4b:"The lesson of Papankusha Ekadashi: it is never too late. One sincere turn towards God can change a whole life.",
howH:"How to observe",h1:"<b>Dashami (21 Oct):</b> eat one simple satvic meal before sunset. No onion, garlic or non-veg.",h2:"<b>Morning:</b> bathe, take a sankalp (vow) before Lord Vishnu and begin the fast.",h3:"<b>Worship:</b> offer tulsi, flowers, a lamp and incense to Padmanabha and Mata Lakshmi.",h4:"<b>Chant and stay awake:</b> chant Hare Krishna and Vishnu's names, read the katha, keep jagaran. Join the Gita Pathan at the temple, 11 AM to 2 PM.",h5:"<b>Parana (23 Oct):</b> break the fast the next morning in the parana window, and share food or give a donation.",
mantraN:"Chant with a calm mind. Even a few rounds count.",
truth:"The real Ekadashi is not just leaving grains. It is keeping the senses away from sin too.",bye:"Hare Krishna! Jai Shree Radha Krishna 🙏",

meanH:"नाम का अर्थ क्या है?",meanP:"<b>पाप</b> + <b>अंकुश</b>। जैसे महावत अंकुश से हाथी को वश में करता है, वैसे ही यह एकादशी हमारे जाने-अनजाने में किये गये पापों पर अंकुश लगाकर हमें पवित्र करती है। पुराणों में इसे व्रतों में श्रेष्ठ कहा गया है।",
whoH:"किसकी पूजा होती है?",whoP:"भगवान विष्णु के <b>पद्मनाभ</b> स्वरूप की (जिनकी नाभि से कमल निकलता है)। साथ में माता लक्ष्मी की पूजा करने से सुख-समृद्धि मिलती है। गुरुवार भी भगवान विष्णु का दिन है, इसलिए फल और बढ़ जाता है।",
gloryH:"इतनी महिमा क्यों?",g1h:"महान पुण्य",g1:"पुराणों के अनुसार इसका फल अनेक अश्वमेध और सूर्य यज्ञों के समान है।",g2h:"पितरों का उद्धार",g2:"केवल आपका ही नहीं, माता पक्ष, पिता पक्ष और पत्नी पक्ष की कई पीढ़ियों का उद्धार होता है।",g3h:"भय से मुक्ति",g3:"यमलोक की यातना नहीं भोगनी पड़ती, भक्त को विष्णु लोक की प्राप्ति होती है।",g4h:"शांत मन",g4:"काम, क्रोध, लोभ और मोह शांत होते हैं।",
kathaH:"संपूर्ण व्रत कथा",kathaIntro:"धर्मराज युधिष्ठिर ने श्रीकृष्ण से पूछा: \"हे मधुसूदन, आश्विन शुक्ल एकादशी का क्या महात्म्य है?\" भगवान मुस्कुराकर बोले: \"हे राजन्, सुनो। मैं तुम्हें एक प्राचीन कथा सुनाता हूँ, जो बड़े से बड़े पाप को भी धो देती है।\"",
k1h:"1. निर्दयी बहेलिया",k1a:"प्राचीन काल में विंध्य पर्वत पर क्रोधन नाम का एक बहेलिया रहता था। नाम के अनुसार ही क्रोध उस पर राज करता था। वह बिना ज़रूरत शिकार करता, चोरी करता, झूठ बोलता, नशा करता और अनेक लोगों को कष्ट देता।",k1b:"उसने धर्म के बारे में कभी एक पल भी नहीं सोचा। इसी तरह वर्ष बीतते गये और बुढ़ापा आ गया, पर उसका मन नहीं बदला।",
k2h:"2. अंतिम समय का भय",k2a:"जब उसके जीवन का अंतिम दिन आया, तब भयानक यमदूत उसके सामने खड़े हो गये। क्रोधन काँप उठा। पहली बार उसे दिखा कि उसके कर्मों ने उसे क्या बना दिया है।",k2b:"वह दौड़कर अंगिरा ऋषि के आश्रम पहुँचा, उनके चरणों में गिरकर रो पड़ा: \"महाराज, मैंने जीवन भर केवल पाप किये हैं। क्या मेरे लिए कोई उपाय है?\"",k2c:"दयालु ऋषि ने उसे उठाकर कहा: \"निराश मत हो। हरि की कृपा किसी भी पाप से बड़ी है। आश्विन शुक्ल की पापांकुशा एकादशी आ गयी है। श्रद्धा से यह व्रत करो, भगवान पद्मनाभ की पूजा करो, उनका नाम जपो और रात भर जागरण करो।\"",
k3h:"3. विष्णुदूत आये",k3a:"क्रोधन ने ठीक वैसा ही किया। उसने उपवास रखा, सच्चे मन से पूजा की, हरि-नाम जपा और आँखों में आँसू लिये रात भर जागरण किया।",k3b:"जब उसका समय आया, तब यमदूत उसे छू भी न सके। उनकी जगह तेजस्वी विष्णुदूत आये, उसे दिव्य विमान में बैठाया और विष्णुलोक ले गये। क्रूर बहेलिया भक्त बन चुका था।",
k4a:"श्रीकृष्ण ने कहा: \"हे युधिष्ठिर, जो श्रद्धा से यह एकादशी करता है, वह पापों से मुक्त होकर परम धाम को प्राप्त होता है। इस कथा को सुनने मात्र से भी हृदय पवित्र हो जाता है।\"",k4b:"पापांकुशा एकादशी की सीख: कभी देर नहीं होती। भगवान की ओर एक सच्चा कदम पूरा जीवन बदल सकता है।",
howH:"व्रत कैसे करें",h1:"<b>दशमी (21 अक्टूबर):</b> सूर्यास्त से पहले एक बार सात्त्विक भोजन करें। प्याज, लहसुन, मांसाहार नहीं।",h2:"<b>सुबह:</b> स्नान करें, भगवान विष्णु के सामने संकल्प लें और उपवास शुरू करें।",h3:"<b>पूजा:</b> पद्मनाभ और माता लक्ष्मी को तुलसी, फूल, दीप और धूप अर्पित करें।",h4:"<b>जप और जागरण:</b> हरे कृष्ण और विष्णु नाम का जप करें, कथा पढ़ें, जागरण करें। मंदिर में सुबह 11 से दोपहर 2 बजे तक गीता पठण में आएँ।",h5:"<b>पारण (23 अक्टूबर):</b> अगली सुबह पारण समय में व्रत खोलें और अन्न या दान दें।",

const LANGS=["en","hi","mr"];
let CUR="en";

/* ---------- language: same as the app's home page ---------- */
function normLang(v){
  if(v==null)return null;
  v=String(v).toLowerCase().replace(/["'\s]/g,"");
  if(v.startsWith("mr")||v.startsWith("mar"))return "mr";
  if(v.startsWith("hi"))return "hi";
  if(v.startsWith("en"))return "en";
  return null;
}
function pick(){
  try{const q=normLang(new URLSearchParams(location.search).get("lang"));if(q)return q;}catch(e){}
  const a=normLang(window.APP_LANG);if(a)return a;                 // app can set window.APP_LANG = "hi" before load
  try{const s=normLang(localStorage.getItem(CONFIG.langKey));if(s)return s;}catch(e){}
  return normLang(navigator.languages&&navigator.languages[0]||navigator.language)||"en";
}

/* ---------- status banner ----------
   No "tomorrow" / "in N days" text. Always a fixed, date-based message:
   - before fast day  -> shows the Ekadashi date
   - fast day         -> "Today is Ekadashi..."
   - next day         -> "Today is parana day..."
   - after that       -> vrat complete                                   */
function status(l){
  const t=T[l],a=CONFIG.fastDate.split("-").map(Number),n=new Date(),
  d=Math.round((new Date(a[0],a[1]-1,a[2])-new Date(n.getFullYear(),n.getMonth(),n.getDate()))/864e5);
  return d>0?t.s0:d===0?t.s2:d===-1?t.s3:t.s4;
}
function setLang(l,fromUser){
  CUR=l;
  const t=T[l];document.documentElement.lang=l;
  document.querySelectorAll("[data-i]").forEach(e=>{e.innerHTML=t[e.dataset.i]});
  document.getElementById("status").textContent=status(l);
  document.getElementById("back").setAttribute("aria-label",t.back);
  document.querySelectorAll("[data-l]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l==l));
  const m=document.getElementById("mq");m.textContent=("हरे कृष्ण • HARE KRISHNA • "+t.temple+" • ").repeat(6);
  if(fromUser){
    try{localStorage.setItem(CONFIG.langKey,l)}catch(e){}           // keep the whole app in the same language
    try{if(typeof window.APP_ON_LANG==="function")window.APP_ON_LANG(l)}catch(e){}
  }
}
document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>setLang(b.dataset.l,true));
if(CONFIG.showLangSwitch===false)document.getElementById("langbox").style.display="none";

/* ---------- helpers ---------- */
let toastTimer;
function toast(msg){
  const e=document.getElementById("toast");e.textContent=msg;e.classList.add("on");
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove("on"),3200);
}
function openUrl(u){
  if(typeof window.APP_OPEN==="function")return window.APP_OPEN(u);   // app can open links natively
  const w=window.open(u,"_blank","noopener");if(!w)location.href=u;
}

/* Back button: app hook first, then browser history, then CONFIG.backUrl */
document.getElementById("back").onclick=()=>{
  if(typeof window.APP_BACK==="function")return window.APP_BACK();
  if(history.length>1)return history.back();
  location.href=CONFIG.backUrl;
};

/* Gita chip scrolls to the Gita card; Map button opens location */
document.getElementById("gchip").onclick=()=>{
  const g=document.getElementById("gita");
  try{g.scrollIntoView({behavior:"smooth",block:"start"})}catch(e){g.scrollIntoView()}
};
document.getElementById("mapbtn").onclick=()=>openUrl(CONFIG.mapUrl);

/* ---------- SHARE: real image + message in selected language ---------- */
function shareText(){
  return T[CUR].shareMsg.replace("{map}",CONFIG.mapUrl).replace("{app}",CONFIG.appUrl);
}
let SHARE_FILE=null,SHARE_LOADING=null;
function prepImage(){
  if(SHARE_FILE)return Promise.resolve(SHARE_FILE);
  if(SHARE_LOADING)return SHARE_LOADING;
  if(!CONFIG.shareImage)return Promise.resolve(null);
  SHARE_LOADING=fetch(CONFIG.shareImage,{mode:"cors",cache:"force-cache"})
    .then(r=>{if(!r.ok)throw new Error("http "+r.status);return r.blob()})
    .then(b=>{
      let type=(b.type&&b.type.startsWith("image/"))?b.type:"image/png";
      const ext=type.split("/")[1].replace("jpeg","jpg").replace("svg+xml","svg");
      SHARE_FILE=new File([b],"papankusha-ekadashi."+ext,{type:type});
      return SHARE_FILE;
    })
    .catch(()=>{SHARE_FILE=null;return null})
    .finally(()=>{SHARE_LOADING=null});
  return SHARE_LOADING;
}
prepImage(); // load once at page start so the button works instantly

async function doShare(){
  const text=shareText(),btn=document.getElementById("share");
  // 1) native app hook (WebView): app receives text + image link and shares natively
  if(typeof window.APP_SHARE==="function")return window.APP_SHARE(text,CONFIG.shareImage,CUR);
  // 2) if the image is still loading, wait a moment (max ~2.5s)
  if(!SHARE_FILE&&SHARE_LOADING){
    btn.disabled=true;
    await Promise.race([SHARE_LOADING,new Promise(r=>setTimeout(r,2500))]);
    btn.disabled=false;
  }
  // 3) Web Share with the image file + text
  if(navigator.share){
    let data=null;
    try{
      if(SHARE_FILE&&navigator.canShare&&navigator.canShare({files:[SHARE_FILE]})){
        data={files:[SHARE_FILE],text:text,title:T[CUR].title};
      }
    }catch(e){data=null}
    if(data){
      try{await navigator.share(data);return}
      catch(e){if(e&&e.name==="AbortError")return}
    }
    // image not possible: share text only
    try{
      await navigator.share({text:text,title:T[CUR].title});
      if(!data)toast(T[CUR].tNoImg);
      return;
    }catch(e){if(e&&e.name==="AbortError")return}
  }
  // 4) last fallback: WhatsApp link with text (image cannot be attached this way)
  toast(T[CUR].tNoImg);
  openUrl("https://wa.me/?text="+encodeURIComponent(text));
}
document.getElementById("share").onclick=doShare;

/* ---------- Image slots ---------- */
document.querySelectorAll("[data-img]").forEach(box=>{
  const url=CONFIG.images[box.dataset.img];
  if(!url)return;
  const im=new Image();const hero=box.dataset.img==="hero";im.loading=hero?"eager":"lazy";im.decoding="async";if(hero)im.fetchPriority="high";im.alt="";
  im.onload=()=>{box.appendChild(im);box.classList.add("on");
    if(box.dataset.img==="hero")document.getElementById("art").style.display="none";};
  im.src=url;   // if the link is broken, the slot just stays hidden
});

/* ---------- Gentle reveal on scroll ---------- */
(function(){
  const els=document.querySelectorAll(".rv");
  if(!("IntersectionObserver" in window)){els.forEach(e=>e.classList.add("in"));return;}
  const io=new IntersectionObserver(es=>{es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}})},{root:document.getElementById("scroll"),threshold:.08});
  els.forEach(e=>io.observe(e));
})();

/* ---------- Native feel: block zoom, long-press menu, selection, drag ---------- */
["contextmenu","selectstart","dragstart","gesturestart","gesturechange","gestureend","copy","cut"].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&["+","-","=","0","a","c"].includes(e.key))e.preventDefault()});
setLang(pick(),false);
</script>
